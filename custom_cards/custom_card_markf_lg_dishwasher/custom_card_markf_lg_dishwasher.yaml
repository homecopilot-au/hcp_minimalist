---
# Card for LG dishwasher - markf UI standard #
card_markf_lg_dishwasher:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "markf_global_defaults"
    - "markf_list_1x2_items"
  show_name: false
  show_label: false
  show_icon: false
  tap_action:
    action: none
  variables:
    card_markf_lg_dishwasher_name: "Dishwasher"
    card_markf_lg_dishwasher_device_name: ""
    card_markf_lg_dishwasher_run_state: ""
    card_markf_lg_dishwasher_process_state: ""
    card_markf_lg_dishwasher_remaining_time_sensor: null
    card_markf_lg_dishwasher_remaining_minutes_sensor: null
    card_markf_lg_dishwasher_color: "color_markf_icon_info_active_ok_inactive_off"
    card_markf_lg_dishwasher_timer_color: "color_markf_dishwasher_timer"
    card_markf_lg_dishwasher_show_indicator: "[[[ return variables._markf_default_show_indicator ]]]"
    ulm_icon_tap_action: "popup"
    ulm_name_tap_action: "popup"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: popup_markf_history
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "markf_icon_info"
          - "ulm_actions_name"
        variables:
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select ]]]"
          ulm_custom_popup:
            template: popup_markf_dishwasher
            popup_variables:
              popup_markf_dishwasher_name: "[[[ return variables.card_markf_lg_dishwasher_name; ]]]"
              popup_markf_dishwasher_device_name: "[[[ return variables.card_markf_lg_dishwasher_device_name; ]]]"
              popup_markf_dishwasher_history_entity: "[[[ return entity.entity_id ]]]"
          markf_icon_info_name: "[[[ return variables.card_markf_lg_dishwasher_name; ]]]"
          markf_icon_info_icon_color: "[[[ return variables.card_markf_lg_dishwasher_color ]]]"
          markf_icon_info_show_indicator: "[[[ return variables.card_markf_lg_dishwasher_show_indicator;]]]"
          markf_icon_info_label: >
            [[[
              if (states[variables.card_markf_lg_dishwasher_run_state].state !== "-") {
                if (states[variables.card_markf_lg_dishwasher_process_state].state !== "-") {
                  return states[variables.card_markf_lg_dishwasher_run_state].state + "/" + states[variables.card_markf_lg_dishwasher_process_state].state;
                } else {
                  return states[variables.card_markf_lg_dishwasher_run_state].state;
                }
              } else {
                return entity.state;
              }
            ]]]

    item2:
      card:
        type: "custom:button-card"
        entity: "[[[ return variables.card_markf_lg_dishwasher_remaining_time_sensor ]]]"
        template: >
          [[[
            var templates = ["markf_widget_icon_state"]
            templates.push(variables.card_markf_lg_dishwasher_timer_color)
            return templates;
          ]]]
        styles:
          card:
            - border-radius: "var(--border-radius)"
            - box-shadow: "none"
            - padding: "0px"
            - border-style: none
            - background-color: transparent
        variables:
          card_markf_lg_dishwasher_remaining_minutes: "[[[ return states[variables.card_markf_lg_dishwasher_remaining_minutes_sensor].state; ]]]"
