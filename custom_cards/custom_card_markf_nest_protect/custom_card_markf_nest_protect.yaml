---
### Card for Google Next Protect smoke alarm - markf UI standard ###
card_markf_nest_protect:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "markf_global_defaults"
  show_name: false
  show_label: false
  show_icon: false
  tap_action:
    action: none
  variables:
    card_markf_nest_protect_icon: "[[[ return entity.attributes.icon ]]]"
    card_markf_nest_protect_name: "Smoke Alarm"
    card_markf_nest_protect_smoke_entity: null
    card_markf_nest_protect_smoke_entity_label: "Smoke"
    card_markf_nest_protect_heat_entity: null
    card_markf_nest_protect_heat_entity_label: "Heat"
    card_markf_nest_protect_co_entity: null
    card_markf_nest_protect_co_entity_label: "CO"
    card_markf_nest_protect_brightness_entity: null
    card_markf_nest_protect_device_name:
    card_markf_nest_protect_header_color: "color_markf_icon_info_active_ok_inactive_alert"
    card_markf_nest_protect_sensor_color: "color_markf_icon_info_active_alert_inactive_ok"
    card_markf_nest_protect_show_indicator: "[[[ return variables._markf_default_show_indicator ]]]"
    ulm_icon_tap_action: "popup"
    ulm_name_tap_action: "popup"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: popup_markf_history

  styles:
    grid:
      - grid-template-areas: '"item1" "item2"'
      - grid-template-columns: "auto"
      - grid-template-rows: "min-content min-content"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--markf_minimalist_default_padding)"
      - border-style: none
      - background-color: transparent
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "markf_icon_info"
          - "ulm_actions_name"
        variables:
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select ]]]"
          ulm_custom_popup:
            template: popup_markf_nest_protect
            popup_variables:
              popup_markf_nest_protect_device_name: "[[[ return variables.card_markf_nest_protect_device_name; ]]]"
              popup_markf_nest_protect_brightness_entity: "[[[ return variables.card_markf_nest_protect_brightness_entity; ]]]"
          markf_icon_info_name: "[[[ return variables.card_markf_nest_protect_name; ]]]"
          markf_icon_info_icon_color: "[[[ return variables.card_markf_nest_protect_header_color ]]]"
          markf_icon_info_label: ""
          markf_icon_info_show_indicator: "[[[ return variables.card_markf_nest_protect_show_indicator;]]]"

    item2:
      card:
        type: "custom:button-card"
        template: "markf_list_3x1_items"
        styles:
          card:
            - border-style: none
            - background-color: transparent
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_markf_nest_protect_smoke_entity ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_markf_nest_protect_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                markf_widget_icon_label_label: "[[[ return variables.card_markf_nest_protect_smoke_entity_label ]]]"

          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_markf_nest_protect_heat_entity ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_markf_nest_protect_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                markf_widget_icon_label_label: "[[[ return variables.card_markf_nest_protect_heat_entity_label ]]]"

          item3:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_markf_nest_protect_co_entity ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_markf_nest_protect_sensor_color)
                  return templates;
                ]]]
              variables:
                markf_widget_icon_label_label: "[[[ return variables.card_markf_nest_protect_co_entity_label ]]]"
