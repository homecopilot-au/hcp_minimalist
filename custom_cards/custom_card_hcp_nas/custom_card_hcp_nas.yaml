---
### NAS - HCP UI standard ###
card_hcp_nas:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "hcp_global_defaults"
  show_name: false
  show_label: false
  show_icon: false
  tap_action:
    action: none
  variables:
    card_hcp_nas_icon: "[[[ return entity.attributes.icon ]]]"
    card_hcp_nas_name: "NAS"
    card_hcp_nas_volume_entity: null
    card_hcp_nas_volume_entity_label: "Volume"
    card_hcp_nas_drive1_entity: null
    card_hcp_nas_drive1_entity_label: "Disk 1"
    card_hcp_nas_drive2_entity: null
    card_hcp_nas_drive2_entity_label: "Disk 2"
    card_hcp_nas_device_name: ""
    card_hcp_nas_drive1_device_name: ""
    card_hcp_nas_drive2_device_name: ""
    card_hcp_nas_volume1_device_name: ""
    card_hcp_nas_header_color: "color_hcp_icon_info_active_alert_inactive_ok"
    card_hcp_nas_sensor_color: "color_hcp_icon_info_active_ok_inactive_alert"
    card_hcp_nas_show_indicator: "[[[ return variables._hcp_default_show_indicator ]]]"
    ulm_icon_tap_action: "popup"
    ulm_name_tap_action: "popup"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: popup_hcp_history

  styles:
    grid:
      - grid-template-areas: '"item1" "item2"'
      - grid-template-columns: "auto"
      - grid-template-rows: "min-content min-content"
      - row-gap: "var(--hcp_minimalist_default_row_gap)"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--hcp_minimalist_default_padding)"
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "hcp_icon_info"
          - "ulm_actions_name"
        variables:
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select ]]]"
          ulm_custom_popup:
            template: popup_hcp_nas
            popup_variables:
              popup_hcp_nas_device_name: "[[[ return variables.card_hcp_nas_device_name; ]]]"
              popup_hcp_nas_drive1_device_name: "[[[ return variables.card_hcp_nas_drive1_device_name; ]]]"
              popup_hcp_nas_drive2_device_name: "[[[ return variables.card_hcp_nas_drive2_device_name; ]]]"
              popup_hcp_nas_volume1_device_name: "[[[ return variables.card_hcp_nas_volume1_device_name; ]]]"
          hcp_icon_info_name: "[[[ return variables.card_hcp_nas_name; ]]]"
          hcp_icon_info_icon_color: "[[[ return variables.card_hcp_nas_header_color ]]]"
          hcp_icon_info_label: ""
          hcp_icon_info_show_indicator: "[[[ return variables.card_hcp_nas_show_indicator;]]]"

    item2:
      card:
        type: "custom:button-card"
        template: "hcp_list_3x1_items"
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_hcp_nas_volume_entity ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_hcp_nas_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_target: "[[[ return variables.ulm_icon_tap_target; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                hcp_widget_icon_label_label: "[[[ return variables.card_hcp_nas_volume_entity_label ]]]"

          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_hcp_nas_drive1_entity ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_hcp_nas_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_target: "[[[ return variables.ulm_icon_tap_target; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                hcp_widget_icon_label_label: "[[[ return variables.card_hcp_nas_drive1_entity_label ]]]"

          item3:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_hcp_nas_drive2_entity ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_hcp_nas_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_target: "[[[ return variables.ulm_icon_tap_target; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                hcp_widget_icon_label_label: "[[[ return variables.card_hcp_nas_drive2_entity_label ]]]"
