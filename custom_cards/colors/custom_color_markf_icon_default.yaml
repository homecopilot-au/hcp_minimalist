---
### Icon default ###
color_markf_icon_default:
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
  state:
    - operator: template
      value: >-
        [[[ return (variables.ulm_translation_state === variables.ulm_translation_unavailable); ]]]
      styles:
        icon:
          - color: "rgba(var(--markf_minimalist_button_unavailable_color), var(--markf_minimalist_icon_unavailable_opacity))"
        img_cell:
          - background-color: "rgba(var(--markf_minimalist_button_unavailable_color), var(--markf_minimalist_icon_unavailable_background_opacity))"
    - operator: default
      styles:
        icon:
          - color: "rgba(var(--markf_minimalist_icon_color), var(--markf_minimalist_icon_on_opacity))"
        img_cell:
          - background-color: "rgba(var(--markf_minimalist_icon_color), var(--markf_minimalist_icon_background_opacity))"
