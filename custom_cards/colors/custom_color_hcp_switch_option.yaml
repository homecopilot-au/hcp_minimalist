---
### Switch default ###
color_hcp_switch_option:
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
  variables:
    color_hcp_switch_option_name: ""
    color_hcp_switch_option_state: "[[[ return entity.state; ]]]"
  state:
    - operator: template
      value: >
        [[[ return (variables.ulm_active_state && variables.color_hcp_switch_option_state === variables.color_hcp_switch_option_name); ]]]
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_switch_on_color), var(--hcp_minimalist_icon_on_opacity))"
        card:
          - background: "rgba(var(--hcp_minimalist_switch_on_color), var(--hcp_minimalist_background_on_opacity))"
    - operator: default
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_switch_off_color), var(--hcp_minimalist_icon_off_opacity))"
        card:
          - background: "rgba(var(--hcp_minimalist_switch_off_color), var(--hcp_minimalist_background_off_opacity))"
