---
### Color for default alerts ###
color_markf_automated_alert_default:
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
  styles:
    icon:
      - color: "rgba(var(--markf_minimalist_automated_alert_default_icon_color), var(--markf_minimalist_state_alert_icon_opacity))"
    name:
      - color: "rgba(var(--markf_minimalist_automated_alert_default_text_color),var(--markf_minimalist_state_alert_text_opacity))"
    label:
      - color: "rgba(var(--markf_minimalist_automated_alert_default_text_color), var(--markf_minimalist_state_alert_text_opacity))"
    img_cell:
      - background-color: "rgba(var(--markf_minimalist_automated_alert_default_icon_color), var(--markf_minimalist_automated_alert_icon_background_opacity))"
