---
color_markf_homecopilot:
  state:
    - operator: template
      value: "on"
      styles:
        icon:
          - color: "rgba(45, 180, 167,1)"
        label:
          - color: "rgba(45, 180, 167,1)"
        name:
          - color: "rgba(45, 180, 167,1)"
        img_cell:
          - background-color: "rgba(45, 180, 167, 0.2)"
        card:
          - background-color: "rgba(45, 180, 167,var(--opacity-bg))"
    - operator: default
      styles:
        icon:
          - color: "rgba(45, 180, 167,1)"
        label:
          - color: "rgba(45, 180, 167,1)"
        name:
          - color: "rgba(45, 180, 167,1)"
        img_cell:
          - background-color: "rgba(45, 180, 167, 0.2)"
        card:
          - background-color: "rgba(45, 180, 167,var(--opacity-bg))"
