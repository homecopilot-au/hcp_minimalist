---
### Color for alert ###
color_hcp_icon_info_active_alert_inactive_off:
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
  state:
    - operator: template
      value: >-
        [[[ return (variables.ulm_translation_state === variables.ulm_translation_unavailable); ]]]
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_unavailable_icon_color), var(--hcp_minimalist_state_unavailable_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--hcp_minimalist_state_unavailable_background_color), var(--hcp_minimalist_state_unavailable_background_opacity))"
    - operator: template
      value: >-
        [[[ return (variables.ulm_active_state); ]]]
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_alert_icon_color), var(--hcp_minimalist_state_alert_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--hcp_minimalist_state_alert_background_color), var(--hcp_minimalist_state_alert_background_opacity))"
        label:
          - color: "rgba(var(--hcp_minimalist_state_alert_text_color), var(--hcp_minimalist_state_ok_text_opacity))"
        name:
          - color: "rgba(var(--hcp_minimalist_state_alert_text_color), var(--hcp_minimalist_state_alert_text_opacity))"
    - operator: default
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_off_icon_color), var(--hcp_minimalist_state_off_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--hcp_minimalist_state_off_background_color), var(--hcp_minimalist_state_off_background_opacity))"
        label:
          - color: "rgba(var(--hcp_minimalist_state_off_text_color), var(--hcp_minimalist_state_off_text_opacity))"
        name:
          - color: "rgba(var(--hcp_minimalist_state_off_text_color), var(--hcp_minimalist_state_off_text_opacity))"
