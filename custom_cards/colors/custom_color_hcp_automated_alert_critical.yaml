---
### Color for critical alerts ###
color_hcp_automated_alert_critical:
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
  styles:
    icon:
      - color: "rgba(var(--hcp_minimalist_automated_alert_critical_icon_color), var(--hcp_minimalist_state_alert_icon_opacity))"
    name:
      - color: "rgba(var(--hcp_minimalist_automated_alert_critical_text_color),var(--hcp_minimalist_state_alert_text_opacity))"
    label:
      - color: "rgba(var(--hcp_minimalist_automated_alert_critical_text_color), var(--hcp_minimalist_state_alert_text_opacity))"
    img_cell:
      - background-color: "rgba(var(--hcp_minimalist_automated_alert_critical_icon_color), var(--hcp_minimalist_automated_alert_icon_background_opacity))"
