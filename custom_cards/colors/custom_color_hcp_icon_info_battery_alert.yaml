---
### Color for battery alert ###
color_hcp_icon_info_battery_alert:
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
  state:
    - operator: template
      value: >-
        [[[ return (variables.ulm_translation_state === variables.ulm_translation_unavailable); ]]]
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_unavailable_icon_color), var(--hcp_minimalist_state_unavailable_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--hcp_minimalist_state_unavailable_background_color), var(--hcp_minimalist_state_unavailable_background_opacity))"
    - operator: template
      value: >-
        [[[ return (entity.state < variables._hcp_default_battery_alert_level) ]]]
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_alert_icon_color), var(--hcp_minimalist_state_alert_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--hcp_minimalist_state_alert_background_color), var(--hcp_minimalist_state_alert_background_opacity))"
    - operator: template
      value: >-
        [[[ return (entity.state < variables._hcp_default_battery_warn_level) ]]]
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_warning_icon_color), var(--hcp_minimalist_state_warning_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--hcp_minimalist_state_warning_background_color), var(--hcp_minimalist_state_warning_background_opacity))"
    - operator: default
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_ok_icon_color), var(--hcp_minimalist_state_ok_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--hcp_minimalist_state_ok_background_color), var(--hcp_minimalist_state_ok_background_opacity))"
