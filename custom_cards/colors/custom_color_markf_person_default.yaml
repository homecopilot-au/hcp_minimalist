---
### Person default ###
color_markf_person_default:
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
  state:
    - operator: template
      value: >-
        [[[ return (variables.ulm_active_state); ]]]
      styles:
        icon:
          - color: "rgba(var(--markf_minimalist_person_home_color), var(--markf_minimalist_icon_on_opacity))"
        img_cell:
          - background-color: "rgba(var(--markf_minimalist_person_home_color), var(--markf_minimalist_background_on_opacity))"
    - operator: default
      styles:
        icon:
          - color: "rgba(var(--markf_minimalist_person_away_color), var(--markf_minimalist_icon_off_opacity))"
        img_cell:
          - background-color: "rgba(var(--markf_minimalist_person_away_color), var(--markf_minimalist_background_off_opacity))"
