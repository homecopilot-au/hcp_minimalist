---
### Cover stop color default ###
color_markf_cover_stop_default:
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
  styles:
    icon:
      - color: "rgba(var(--markf_minimalist_button_icon_on_color), var(--markf_minimalist_button_icon_opacity))"
    img_cell:
      - background-color: "rgba(var(--markf_minimalist_button_background_color), var(--markf_minimalist_button_background_opacity))"
