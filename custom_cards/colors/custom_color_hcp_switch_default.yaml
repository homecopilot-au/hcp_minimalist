---
### Switch default ###
color_hcp_switch_default:
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
  state:
    - operator: template
      value: >-
        [[[ return (variables.ulm_active_state) ]]]
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_switch_on_color), var(--hcp_minimalist_icon_on_opacity))"
        img_cell:
          - background-color: "rgba(var(--hcp_minimalist_switch_background_color), var(--hcp_minimalist_background_on_opacity))"
    - operator: default
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_switch_off_color), var(--hcp_minimalist_icon_off_opacity))"
        img_cell:
          - background-color: "rgba(var(--hcp_minimalist_switch_background_color), var(--hcp_minimalist_background_off_opacity))"
