---
color_hcp_button_sensor_active_ok_inactive_off:
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
  state:
    - operator: template
      value: >-
        [[[ return (variables.ulm_active_state); ]]]
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_ok_icon_color), var(--hcp_minimalist_state_ok_icon_opacity))"
        label:
          - color: "rgba(var(--hcp_minimalist_state_ok_text_color), var(--hcp_minimalist_state_ok_text_opacity))"
        name:
          - color: "rgba(var(--hcp_minimalist_state_ok_text_color), var(--hcp_minimalist_state_ok_text_opacity))"
        card:
          - background-color: "rgba(var(--hcp_minimalist_state_ok_background_color), var(--hcp_minimalist_state_ok_background_opacity))"
    - operator: default
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_off_icon_color), var(--hcp_minimalist_state_off_icon_opacity))"
        label:
          - color: "rgba(var(--hcp_minimalist_state_off_text_color), var(--hcp_minimalist_state_off_text_opacity))"
        name:
          - color: "rgba(var(--hcp_minimalist_state_off_text_color), var(--hcp_minimalist_state_off_text_opacity))"
        card:
          - background-color: "rgba(var(--hcp_minimalist_state_off_background_color), var(--hcp_minimalist_state_off_background_opacity))"
