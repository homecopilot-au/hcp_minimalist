---
### Alert for sensor where normal state is on/active ###
color_markf_icon_info_active_ok_inactive_alert:
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
  state:
    - operator: template
      value: >-
        [[[ return (variables.ulm_translation_state === variables.ulm_translation_unavailable); ]]]
      styles:
        icon:
          - color: "rgba(var(--markf_minimalist_state_unavailable_icon_color), var(--markf_minimalist_state_unavailable_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--markf_minimalist_state_unavailable_background_color), var(--markf_minimalist_state_unavailable_background_opacity))"
    - operator: template
      value: >-
        [[[ return (variables.ulm_active_state); ]]]
      styles:
        icon:
          - color: "rgba(var(--markf_minimalist_state_ok_icon_color), var(--markf_minimalist_state_ok_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--markf_minimalist_state_ok_background_color), var(--markf_minimalist_state_ok_background_opacity))"
        name:
          - color: "rgba(var(--markf_minimalist_state_ok_text_color), var(--markf_minimalist_state_ok_text_opacity))"
        label:
          - color: "rgba(var(--markf_minimalist_state_ok_text_color), var(--markf_minimalist_state_ok_text_opacity))"
    - operator: default
      styles:
        icon:
          - color: "rgba(var(--markf_minimalist_state_alert_icon_color), var(--markf_minimalist_state_alert_icon_opacity))"
        img_cell:
          - background-color: "rgba(var(--markf_minimalist_state_alert_background_color), var(--markf_minimalist_state_alert_background_opacity))"
        name:
          - color: "rgba(var(--markf_minimalist_state_alert_text_color), var(--markf_minimalist_state_alert_text_opacity))"
        label:
          - color: "rgba(var(--markf_minimalist_state_alert_text_color), var(--markf_minimalist_state_alert_text_opacity))"
