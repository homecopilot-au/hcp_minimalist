---
color_hcp_chip_state_alert:
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
  state:
    - operator: template
      value: >-
        [[[ return (variables.ulm_active_state); ]]]
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_alert_icon_color), var(--hcp_minimalist_icon_on_opacity))"
        label:
          - color: "rgba(var(--hcp_minimalist_state_alert_text_color), var(--hcp_minimalist_state_alert_text_opacity))"
        card:
          - background-color: "rgba(var(--hcp_minimalist_state_ok_background_color), var(--hcp_minimalist_state_ok_background_opacity))"
    - operator: default
      styles:
        icon:
          - color: "rgba(var(--hcp_minimalist_state_off_icon_color), var(--hcp_minimalist_icon_off_opacity))"
        label:
          - color: "rgba(var(--hcp_minimalist_state_off_text_color), var(--hcp_minimalist_state_off_text_opacity))"
        card:
          - background-color: "rgba(var(--hcp_minimalist_state_off_background_color), var(--hcp_minimalist_state_off_background_opacity))"
