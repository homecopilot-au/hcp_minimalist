---
### Text default ###
color_hcp_card_text_default:
  template: 
    - "ulm_translation_engine"
    - "hcp_global_defaults"
  styles:
    label:
      - color: "rgba(var(--hcp_minimalist_label_text_color), var(--hcp_minimalist_text_default_opacity))"
    name:
      - color: "rgba(var(--hcp_minimalist_name_text_color), var(--hcp_minimalist_text_default_opacity))"
