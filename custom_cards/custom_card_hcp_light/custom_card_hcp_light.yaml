---
### Card Light with Power - HCP UI standard ###
card_hcp_light:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "hcp_global_defaults"
  variables:
    card_hcp_light_name: "[[[ return entity.attributes.friendly_name ]]]"
    card_hcp_light_icon: "[[[ return entity.attributes.icon ]]]"
    card_hcp_light_enable_collapse: false
    card_hcp_light_enable_slider: true
    card_hcp_light_enable_slider_minSet: 0
    card_hcp_light_enable_slider_maxSet: 100
    card_hcp_light_enable_color: false
    card_hcp_light_force_background_color: false
    card_hcp_light_enable_popup: false
    card_hcp_light_enable_popup_tap: false
    card_hcp_light_color_palette: ""
    card_hcp_light_icon_default_color: "color_hcp_light_default"
    card_hcp_light_icon_entity_color: "color_hcp_light_rgb"
    card_hcp_light_power_entity: null
    card_hcp_light_power_color: "color_hcp_switch_default"
    card_hcp_light_text_color: "color_hcp_card_text_default"
    card_hcp_light_show_indicator: "[[[ return variables._hcp_default_show_icon_indicator; ]]]"
    ulm_icon_tap_action: "toggle"
    ulm_name_tap_action: "popup"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
  show_icon: false
  show_name: false
  show_label: false
  styles:
    grid:
      - grid-template-areas: >
          [[[
                if (variables.card_hcp_light_enable_collapse && !variables.ulm_active_state) {
                  return "\"item1\"";
                } 
                
                var areas = [];
                areas.push("item1");

                if (variables.card_hcp_light_enable_slider) {
                  areas.push("slider");
                }
                return "\"" + areas.join("\" \"") + "\"";
          ]]]
      - grid-template-columns: "1fr"
      - grid-template-rows: >
          [[[
                if (variables.card_hcp_light_enable_collapse && !variables.ulm_active_state) {
                    return "min-content";
                } else if (variables.card_hcp_light_enable_slider) {
                    return "min-content min-content";
                } else {
                  return "min-content";
                }
          ]]]
      - row-gap: "var(--hcp_minimalist_default_row_gap)"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--hcp_minimalist_default_padding)"
      - border-style: none
      - background-color: transparent
    custom_fields:
      slider:
        - display: >
            [[[
                  if (variables.card_hcp_light_enable_collapse && !variables.ulm_active_state) {
                      return "none";
                  } else if (variables.card_hcp_light_enable_slider) {
                      return "block";
                  } else {
                    return "none";
                  }
            ]]]
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template: >-
          [[[
            var templates = ["ulm_actions_name"]
            if (variables.card_hcp_light_power_entity) {
              templates.push("hcp_icon_power");
              return templates;
            } else {
              templates.push("hcp_icon_info");
              return templates;
            }
          ]]]
        variables:
          hcp_icon_power_power_entity: "[[[ return variables.card_hcp_light_power_entity ]]]"
          hcp_icon_power_power_entity_icon: "[[[ return variables._hcp_default_power_entity_icon; ]]]"
          hcp_icon_power_text_color: "[[[ return variables.card_hcp_light_text_color ]]]"
          hcp_icon_power_name: "[[[ return variables.card_hcp_light_name ]]]"
          hcp_icon_power_icon: "[[[ return variables.card_hcp_light_icon ]]]"
          hcp_icon_power_icon_color: >
            [[[
                if (variables.card_hcp_light_enable_color && entity.attributes.rgb_color) { 
                  return variables.card_hcp_light_icon_entity_color;
                } else {
                  return variables.card_hcp_light_icon_default_color;
                }
            ]]]
          hcp_icon_info_text_color: "[[[ return variables.card_hcp_light_text_color ]]]"
          hcp_icon_info_name: "[[[ return variables.card_hcp_light_name ]]]"
          hcp_icon_info_icon: "[[[ return variables.card_hcp_light_icon ]]]"
          hcp_icon_info_icon_color: >
            [[[
                if (variables.card_hcp_light_enable_color && entity.attributes.rgb_color) { 
                  return variables.card_hcp_light_icon_entity_color;
                } else {
                  return variables.card_hcp_light_icon_default_color;
                }
            ]]]
          hcp_icon_info_show_indicator: "[[[ return variables.card_hcp_light_show_indicator ]]]"
          hcp_icon_power_show_indicator: "[[[ return variables.card_hcp_light_show_indicator ]]]"
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select ]]]"
          # ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"

    slider:
      card:
        type: "custom:my-slider-v2"
        entity: "[[[ return entity.entity_id ]]]"
        allowTapping: "[[[ return variables.card_hcp_cover_slider_allow_tapping ]]]"
        vertical: "[[[ return variables.card_hcp_cover_slider_vertical ]]]"
        flipped: "[[[ return variables.card_hcp_cover_slider_flipped ]]]"
        styles:
          card:
            - height: "var(--hcp_minimalist_slider_height_horizontal)"
          container:
            - border-width: "var(--hcp_minimalist_slider_border_width)"
            - border-style: "var(--hcp_minimalist_slider_border_style)"
            - border-color: "[[[ return 'rgba(var(--hcp_minimalist_slider_border_colour),var(--hcp_minimalist_slider_border_opacity))'; ]]]"
            - border-radius: var(--hcp_minimalist_slider_border_radius)
            - box-shadow: "var(--hcp_minimalist_slider_box_shadow)"
            - background: "var(--google-red)"
          progress:
            background: >
              [[[
                  var color = entity.attributes.rgb_color;
                  if (variables.ulm_translation_state === variables.ulm_translation_unavailable){
                    return "rgba(var(--hcp_minimalist_slider_unavailable_color),var(--hcp_minimalist_slider_main_opacity))";
                  }
                  else if (color && variables.card_hcp_light_enable_color){
                    return "rgba(" + color + ",var(--hcp_minimalist_slider_main_opacity))";
                  }
                  else{
                    return "rgba(var(--hcp_minimalist_slider_light_main_color),var(--hcp_minimalist_slider_main_opacity))";                  }
              ]]]
          track:
            - background: >
                [[[
                    var color = entity.attributes.rgb_color;
                    if (variables.ulm_translation_state === variables.ulm_translation_unavailable){
                      return "rgb(var(--hcp_minimalist_slider_unavailable_color))";
                    } else {
                      return "rgba(var(--hcp_minimalist_slider_light_secondary_color)";
                    }
                ]]]
          thumb:
            - width: "var(--hcp_minimalist_slider_thumb_width_horizontal)"
            - background: "[[[ return 'rgba(var(--hcp_minimalist_slider_thumb_color),var(--hcp_minimalist_slider_thumb_opacity))'; ]]]"
            - border-radius: "var(--hcp_minimalist_slider_thumb_border_radius_horizontal)"
