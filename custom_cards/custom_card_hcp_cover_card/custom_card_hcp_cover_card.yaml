### Card Cover - HCP UI standard ###
card_hcp_cover:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "hcp_global_defaults"
  show_last_changed: false
  variables:
    card_hcp_cover_name: "[[[ return entity.attributes.friendly_name ]]]"
    card_hcp_cover_invert_percent: false
    card_hcp_cover_display_left_right: false
    card_hcp_cover_gate: false
    card_hcp_cover_enable_controls: false
    card_hcp_cover_enable_slider: false
    card_hcp_cover_enable_tilt: false
    card_hcp_cover_show_last_changed: false
    card_hcp_cover_icon: false
    card_hcp_cover_power_entity: null
    card_hcp_cover_power_entity_icon: null
    card_hcp_cover_slider_allow_tapping: false
    card_hcp_cover_slider_vertical: false
    card_hcp_cover_slider_flipped: false
    card_hcp_cover_close_button_color: "color_hcp_cover_close_default"
    card_hcp_cover_tilt_close_button_color: "color_hcp_cover_tilt_close_default"
    card_hcp_cover_open_button_color: "color_hcp_cover_open_default"
    card_hcp_cover_tilt_open_button_color: "color_hcp_cover_tilt_open_default"
    card_hcp_cover_stop_button_color: "color_hcp_cover_stop_default"
    card_hcp_cover_open_state: "[[[ return hass.localize('component.cover.entity_component._.state.open') ]]]"
    card_hcp_cover_opening_state: "[[[ return hass.localize('component.cover.entity_component._.state.opening') ]]]"
    card_hcp_cover_closed_state: "[[[ return hass.localize('component.cover.entity_component._.state.closed') ]]]"
    card_hcp_cover_closing_state: "[[[ return hass.localize('component.cover.entity_component._.state.closing') ]]]"
    card_hcp_cover_show_indicator: "[[[ return variables._hcp_default_show_icon_indicator; ]]]"
    ulm_icon_tap_action: "popup"
    ulm_icon_hold_action: "popup"
    ulm_name_tap_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: popup_hcp_cover
  show_icon: false
  show_name: false
  show_label: false
  styles:
    grid:
      - grid-template-areas: >
          [[[
            var areas = [];
            areas.push("item1 item1");
            if (variables.card_hcp_cover_enable_controls) {
                areas.push("item2 item2");
            }
            if (variables.card_hcp_cover_enable_slider) {
                areas.push("item3 item3");
            }
            if (variables.card_hcp_cover_enable_tilt) {
                areas.push("item4 item4");
            }
            return "\"" + areas.join("\" \"") + "\"";
          ]]]
      - grid-template-columns: >
          [[[
                if (variables.card_hcp_cover_power_entity !== null) {
                    return "4fr 1fr";
                } else {
                    return "1fr 1fr";
                }
          ]]]
      - grid-template-rows: >
          [[[
            var rows = [];
            rows.push("min-content");
            if (variables.card_hcp_cover_enable_controls) {
                rows.push("min-content");
            }
            if (variables.card_hcp_cover_enable_slider) {
                rows.push("min-content");
            }
            if (variables.card_hcp_cover_enable_tilt) {
                rows.push("min-content");
            }
            return rows.join(" ");
          ]]]
      - row-gap: "var(--hcp_minimalist_default_row_gap)"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--hcp_minimalist_default_padding)"
      - border-style: none
      - background-color: transparent
    custom_fields:
      item2:
        - display: >
            [[[
              if (variables.card_hcp_cover_enable_controls) {
                  return "block";
              } else {
                  return "none";
              }
            ]]]
      item3:
        - display: >
            [[[
              if (variables.card_hcp_cover_enable_slider) {
                  return "block";
              } else {
                  return "none";
              }
            ]]]
      item4:
        - display: >
            [[[
              if (variables.card_hcp_cover_enable_tilt) {
                  return "block";
              } else {
                  return "none";
              }
            ]]]
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "hcp_icon_power"
          - "ulm_actions_name"
        variables:
          hcp_icon_power_name: "[[[ return variables.card_hcp_cover_name; ]]]"
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select ]]]"
          ulm_custom_popup: "[[[ return variables.ulm_custom_popup ]]]"
          hcp_icon_power_icon: >
            [[[
              var icon = entity.attributes.icon;
              var icon_state = {
                "open": variables.card_hcp_cover_open_state,
                "opening": variables.card_hcp_cover_opening_state,
                "closed": variables.card_hcp_cover_closed_state,
                "closing": variables.card_hcp_cover_closing_state
              };
              if(entity.attributes?.device_class){
                var device_class = entity.attributes?.device_class;
              }
              return variables.card_hcp_cover_icon || (icon_state[entity.state] === variables.card_hcp_cover_open_state ? variables._hcp_default_cover_icon_open[device_class] : variables._hcp_default_cover_icon_closed[device_class]) || icon
            ]]]
          hcp_icon_power_label: >
            [[[
              var position = states[entity.entity_id]?.attributes?.current_position;
              var invert = {
                "closed": variables.card_hcp_cover_open_state,
                "closing": variables.card_hcp_cover_opening_state,
                "open": variables.card_hcp_cover_closed_state,
                "opening": variables.card_hcp_cover_closing_state
              };

              if(variables._hcp_default_cover_unavailable_states.includes(entity.state)){
                return variables.ulm_translation_state;
              }

              if(variables.card_hcp_cover_invert_percent && typeof entity !== variables._hcp_default_entity_undefined){
                if(position == 0){
                  return invert[entity.state] + " • " + (100 - position) + "%";
                } else {
                  return invert[entity.state]
                }
              }

              if (typeof entity !== variables._hcp_default_entity_undefined){
                if (entity == 0) {
                  return variables.ulm_translation_state;
                } else if (typeof position !== variables._hcp_default_entity_undefined) {
                  return variables.ulm_translation_state + " • " + position + "%";
                } else {
                  return variables.ulm_translation_state;
                }
              }
              return variables.ulm_translation_state;
            ]]]
          hcp_icon_power_power_entity: "[[[ return variables.card_hcp_cover_power_entity ]]]"
          hcp_icon_power_power_entity_icon: "[[[ return variables.card_hcp_cover_power_entity_icon ]]]"
          hcp_icon_power_show_indicator: "[[[ return variables.card_hcp_cover_show_indicator ]]]"
    item2:
      card:
        type: "custom:button-card"
        template: "hcp_list_3x1_items"
        styles:
          card:
            - border-style: none
            - background-color: transparent
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_button"]
                  templates.push(variables.card_hcp_cover_close_button_color)
                  return templates;
                ]]]
              tap_action:
                action: "perform-action"
                perform_action: "cover.close_cover"
                target:
                  entity_id: "[[[ return entity.entity_id ]]]"
              icon: >-
                [[[
                  if (variables.card_hcp_cover_display_left_right){
                      return variables._hcp_default_cover_tilt_open_icon;
                  }
                  var device_class = entity.attributes?.device_class;
                  if (variables.card_hcp_cover_gate){
                      return variables._hcp_default_cover_close_curtain_icon;
                  }
                  return variables._hcp_default_cover_open_icon;
                ]]]
          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_button"]
                  templates.push(variables.card_hcp_cover_stop_button_color)
                  return templates;
                ]]]
              tap_action:
                action: "perform-action"
                perform_action: "cover.stop_cover"
                target:
                  entity_id: "[[[ return entity.entity_id ]]]"
              icon: "[[[ return variables._hcp_default_cover_stop_icon ]]]"
          item3:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_button"]
                  templates.push(variables.card_hcp_cover_open_button_color)
                  return templates;
                ]]]
              tap_action:
                action: "perform-action"
                perform_action: "cover.open_cover"
                target:
                  entity_id: "[[[ return entity.entity_id ]]]"
              icon: >-
                [[[
                  if (variables.card_hcp_cover_display_left_right){
                      return variables._hcp_default_cover_tilt_close_icon;
                  }
                  var device_class = entity.attributes?.device_class;
                  if (variables.card_hcp_cover_gate){
                      return variables._hcp_default_cover_open_curtain_icon;
                  }
                  return variables._hcp_default_cover_close_icon;
                ]]]
    item3:
      card:
        type: "custom:my-slider-v2"
        entity: "[[[ return entity.entity_id ]]]"
        allowTapping: "[[[ return variables.card_hcp_cover_slider_allow_tapping ]]]"
        vertical: "[[[ return variables.card_hcp_cover_slider_vertical ]]]"
        flipped: "[[[ return variables.card_hcp_cover_slider_flipped ]]]"
        styles:
          card:
            - height: "var(--hcp_minimalist_slider_height_horizontal)"
          container:
            - border-width: "var(--hcp_minimalist_slider_border_width)"
            - border-style: "var(--hcp_minimalist_slider_border_style)"
            - border-color: "[[[ return 'rgba(var(--hcp_minimalist_slider_border_colour),var(--hcp_minimalist_slider_border_opacity))'; ]]]"
            - border-radius: var(--hcp_minimalist_slider_border_radius)
            - box-shadow: "var(--hcp_minimalist_slider_box_shadow)"
          progress:
            - background: "[[[ return 'rgba(var(--hcp_minimalist_slider_main_color),var(--hcp_minimalist_slider_main_opacity))'; ]]]"
          track:
            - background: "[[[ return 'rgba(var(--hcp_minimalist_slider_secondary_color),var(--hcp_minimalist_slider_secondary_opacity))'; ]]]"
          thumb:
            - width: "var(--hcp_minimalist_slider_thumb_width_horizontal)"
            - background: "[[[ return 'rgba(var(--hcp_minimalist_slider_thumb_color),var(--hcp_minimalist_slider_thumb_opacity))'; ]]]"
            - border-radius: "var(--hcp_minimalist_slider_thumb_border_radius_horizontal)"
    item4:
      card:
        type: "custom:button-card"
        template: "hcp_list_3x1_items"
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_button"]
                  templates.push(variables.card_hcp_cover_tilt_close_button_color)
                  return templates;
                ]]]
              tap_action:
                action: "perform-action"
                perform_action: "cover.close_cover_tilt"
                target:
                  entity_id: "[[[ return entity.entity_id ]]]"
              icon: "[[[ return variables._hcp_default_cover_tilt_open_icon ]]]"
          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_button"]
                  templates.push(variables.card_hcp_cover_stop_button_color)
                  return templates;
                ]]]
              tap_action:
                action: "perform-action"
                perform_action: "cover.stop_cover_tilt"
                target:
                  entity_id: "[[[ return entity.entity_id ]]]"
              icon: "[[[ return variables._hcp_default_cover_stop_icon ]]]"
          item3:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_button"]
                  templates.push(variables.card_hcp_cover_tilt_open_button_color)
                  return templates;
                ]]]
              tap_action:
                action: "perform-action"
                perform_action: "cover.open_cover_tilt"
                target:
                  entity_id: "[[[ return entity.entity_id ]]]"
              icon: "[[[ return variables._hcp_default_cover_tilt_close_icon ]]]"
