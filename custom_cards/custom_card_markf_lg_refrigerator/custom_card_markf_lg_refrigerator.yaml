---
# Card for LG refrigerator - markf UI standard #
card_markf_lg_refrigerator:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "markf_global_defaults"
  show_name: false
  show_label: false
  show_icon: false
  tap_action:
    action: none
  variables:
    card_markf_lg_refrigerator_name: "Refrigerator"
    card_markf_lg_refrigerator_enable_color: false
    card_markf_lg_refrigerator_force_background_color: false
    card_markf_lg_refrigerator_fridge_control: ""
    card_markf_lg_refrigerator_freezer_control: ""
    card_markf_lg_refrigerator_express_mode: ""
    card_markf_lg_refrigerator_fridge_state: null
    card_markf_lg_refrigerator_fridge_temp: null
    card_markf_lg_refrigerator_fridge_label: "Fridge"
    card_markf_lg_refrigerator_freezer_state: null
    card_markf_lg_refrigerator_freezer_temp: null
    card_markf_lg_refrigerator_freezer_label: "Freezer"
    card_markf_lg_refrigerator_door: null
    card_markf_lg_refrigerator_door_label: "Door"
    card_markf_lg_refrigerator_color: "color_markf_icon_info_active_ok_inactive_alert"
    card_markf_lg_refrigerator_sensor_color: "color_markf_icon_info_active_alert_inactive_ok"
    card_markf_lg_refrigerator_show_indicator: "[[[ return variables._markf_default_show_indicator ]]]"
    ulm_icon_tap_action: "popup"
    ulm_name_tap_action: "popup"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: popup_markf_history

  styles:
    grid:
      - grid-template-areas: "'item1 item1' 'item2 item2'"
      - grid-template-columns: "min-content auto"
      - grid-template-rows: "min-content min-content"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--markf_minimalist_default_padding)"

  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "markf_icon_info"
          - "ulm_actions_name"
        variables:
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select ]]]"
          ulm_custom_popup:
            template: popup_markf_refrigerator
            popup_variables:
              popup_markf_refrigerator_name: "[[[ return variables.card_markf_lg_refrigerator_name; ]]]"
              popup_markf_refrigerator_fridge_control: "[[[ return variables.card_markf_lg_refrigerator_fridge_control; ]]]"
              popup_markf_refrigerator_freezer_control: "[[[ return variables.card_markf_lg_refrigerator_freezer_control; ]]]"
              popup_markf_refrigerator_express_mode: "[[[ return variables.card_markf_lg_refrigerator_express_mode; ]]]"
              popup_markf_refrigerator_history_entity: "[[[ return entity.entity_id ]]]"
          markf_icon_info_name: "[[[ return variables.card_markf_lg_refrigerator_name; ]]]"
          markf_icon_info_icon_color: "[[[ return variables.card_markf_lg_refrigerator_color ]]]"
          markf_icon_info_show_indicator: "[[[ return variables.card_markf_lg_refrigerator_show_indicator;]]]"

    item2:
      card:
        type: "custom:button-card"
        template: "markf_list_3x1_items"
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_markf_lg_refrigerator_fridge_state ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_markf_lg_refrigerator_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                markf_widget_icon_label_label: "[[[ return variables.card_markf_lg_refrigerator_fridge_label ]]]"

          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_markf_lg_refrigerator_freezer_state ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_markf_lg_refrigerator_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                markf_widget_icon_label_label: "[[[ return variables.card_markf_lg_refrigerator_freezer_label ]]]"

          item3:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_markf_lg_refrigerator_door ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_markf_lg_refrigerator_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                markf_widget_icon_label_label: "[[[ return variables.card_markf_lg_refrigerator_door_label ]]]"
