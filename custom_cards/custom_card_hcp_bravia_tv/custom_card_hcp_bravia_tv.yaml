---
### Sony Bravia TV - HCP UI standard ###
card_hcp_bravia_tv:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "hcp_global_defaults"
  show_icon: false
  show_name: false
  show_label: false
  variables:
    card_hcp_bravia_tv_enable_collapse: true
    card_hcp_bravia_tv_hide_sec2: null
    card_hcp_bravia_tv_hide_sec3: null
    card_hcp_bravia_tv_remote_entity: null
    card_hcp_bravia_tv_sound_entity: null
    card_hcp_bravia_tv_entity_sound: "sound"
    card_hcp_bravia_tv_entity_tv: "tv"
    card_hcp_bravia_tv_icon_color: "color_hcp_switch_default"
    card_hcp_bravia_tv_text_color: "color_hcp_card_text_default"
    card_hcp_bravia_tv_button_color: "color_hcp_button_default"
    card_hcp_bravia_tv_power_button_color: "color_hcp_switch_default"
    card_hcp_bravia_tv_blank_button_color: "color_hcp_button_blank_default"
    card_hcp_bravia_tv_padding: "var(--hcp_minimalist_default_padding)"
    card_hcp_bravia_tv_row_gap: "var(--hcp_minimalist_default_row_gap)"
    card_hcp_bravia_tv_no_box_shadow: "none"
    card_hcp_bravia_tv_show_indicator: "[[[ return variables._hcp_default_show_indicator ]]]"
    card_hcp_bravia_tv_remote_entity_icon: "[[[ return variables._hcp_default_power_entity_icon; ]]]"
    ulm_name_tap_action: "toggle"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: popup_hcp_history
    card_hcp_bravia_tv_input_off: "[[[ return hass.localize('component.input_boolean.entity_component._.state.off') ]]]"
    card_hcp_bravia_tv_input_on: "[[[ return hass.localize('component.input_boolean.entity_component._.state.on') ]]]"
    card_hcp_bravia_tv_channel_name: "[[[ return hass.localize('component.media_player.entity_component._.state_attributes.media_channel.name') ]]]"
  triggers_update: "all"
  styles:
    grid:
      - grid-template-areas: >
          [[[
                if (variables.card_hcp_bravia_tv_enable_collapse && !variables.ulm_active_state ) {
                  return "\"header1\"";
                } else {
                  return "\"header1\" \"sec1\" \"header2\" \"sec2\" \"header3\" \"sec3\"";
                }
          ]]]
      - grid-template-columns: "1fr"
      - grid-template-rows: >
          [[[
                if (variables.card_hcp_bravia_tv_enable_collapse && !variables.ulm_active_state ) {
                    return "1fr";
                } else {
                    return "min-content min-content min-content min-content min-content min-content";
                }
          ]]]
      - row-gap: "[[[ return variables.card_hcp_bravia_tv_row_gap ]]]"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "[[[ return variables.card_hcp_bravia_tv_padding ]]]"
      - border-style: none
      - background-color: transparent
    custom_fields:
      sec1:
        - display: >
            [[[
                  if (variables.ulm_active_state) {
                      return "block";
                  } else {
                      return "none";
                  }
            ]]]
      header2:
        - display: >
            [[[
                  if (variables.ulm_active_state) {
                      return "block";
                  } else {
                      return "none";
                  }
            ]]]
      sec2:
        - display: >
            [[[
                  if (states[variables.card_hcp_bravia_tv_hide_sec2].state === variables.card_hcp_bravia_tv_input_off.toLowerCase() && variables.ulm_active_state) {
                      return "block";
                  } else {
                      return "none";
                  }
            ]]]
      header3:
        - display: >
            [[[
                  if (variables.ulm_active_state) {
                      return "block";
                  } else {
                      return "none";
                  }
            ]]]
      sec3:
        - display: >
            [[[
                  if (states[variables.card_hcp_bravia_tv_hide_sec3].state === variables.card_hcp_bravia_tv_input_off.toLowerCase() && variables.ulm_active_state) {
                      return "block";
                  } else {
                      return "none";
                  }
            ]]]
  custom_fields:
    header1:
      card:
        type: "custom:button-card"
        template: "hcp_list_2x1_items"
        styles:
          grid:
            - grid-template-columns: "4.5fr 0.5fr"
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              template:
                - "hcp_icon_info"
                - "ulm_actions_name"
                - "ulm_actions_icon"
              entity: "[[[ return entity.entity_id ]]]"
              variables:
                hcp_icon_info_icon_color: "[[[ return variables.card_hcp_bravia_tv_icon_color ]]]"
                hcp_icon_info_text_color: "[[[ return variables.card_hcp_bravia_tv_text_color ]]]"
                hcp_icon_info_label: >-
                  [[[
                    if (variables.ulm_active_state) {
                      if (states[entity.entity_id].attributes.media_content_type === variables.card_hcp_bravia_tv_channel_name.toLowerCase()) {
                        return entity.attributes.media_content_type + ' ' + entity.attributes.media_content_id
                      } else {
                        return entity.attributes.media_content_type + ' ' + entity.attributes.media_title
                      }
                    } else {
                      return variables.ulm_translation_state;
                    }
                  ]]]
                hcp_icon_info_show_indicator: "[[[ return variables.card_hcp_bravia_tv_show_indicator;]]]"
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_target: "[[[ return variables.ulm_icon_tap_target; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return variables.card_hcp_bravia_tv_remote_entity ]]]"
              template: >
                [[[
                  var templates = ["hcp_widget_icon"]
                    templates.push(variables.card_hcp_bravia_tv_power_button_color);
                  return templates;
                ]]]
              tap_action:
                action: perform-action
                perform_action: remote.send_command
                target:
                  entity_id: "[[[ return variables.card_hcp_bravia_tv_remote_entity ]]]"
                data:
                  command: TvPower
              icon: "[[[ return variables.card_hcp_bravia_tv_remote_entity_icon ]]]"

    sec1:
      card:
        type: "custom:button-card"
        template: "hcp_list_5x4_items"
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              template: >
                [[[
                  var templates = ["hcp_widget_button"]
                  if (typeof variables.hcp_bravia_tv_config_sec1_01_icon === variables._hcp_default_entity_undefined) {
                    templates.push(variables.card_hcp_bravia_tv_blank_button_color);
                  } else {
                    templates.push(variables.card_hcp_bravia_tv_button_color);
                  }
                  return templates;
                ]]]
              tap_action:
                action: >
                  [[[
                    if (typeof variables.hcp_bravia_tv_config_sec1_01_icon === variables._hcp_default_entity_undefined) {
                      return "none";
                    } else {
                      return variables.hcp_bravia_tv_config_action;
                    }
                  ]]]
                service: >
                  [[[
                    if (typeof variables.hcp_bravia_tv_config_sec1_01_service === variables._hcp_default_entity_undefined) {
                      return variables.hcp_bravia_tv_config_sec1_service;
                    } else if (variables.hcp_bravia_tv_config_sec1_01_service !== "") {
                      return variables.hcp_bravia_tv_config_sec1_01_service;
                    }
                  ]]]
                target:
                  entity_id: >
                    [[[ 
                      if (typeof variables.hcp_bravia_tv_config_sec1_01_service_entity === variables._hcp_default_entity_undefined) {
                        return variables.card_hcp_bravia_tv_remote_entity;
                      } else if (variables.hcp_bravia_tv_config_sec1_01_service_entity === variables.card_hcp_bravia_tv_entity_sound ) {
                        return variables.card_hcp_bravia_tv_sound_entity;
                      } else if (variables.hcp_bravia_tv_config_sec1_01_service_entity === variables.card_hcp_bravia_tv_entity_tv ) {
                        return entity.entity_id;
                      } else {
                        return null;
                      }
                    ]]]
                data: >
                  [[[
                    if (typeof variables.hcp_bravia_tv_config_sec1_01_ismute !== variables._hcp_default_entity_undefined) {
                      if (variables.hcp_bravia_tv_config_sec1_01_ismute) {
                        return { "is_volume_muted": states[variables.card_hcp_bravia_tv_sound_entity].attributes.is_volume_muted ? false : true };
                      }
                    } else if (typeof variables.hcp_bravia_tv_config_sec1_01_command === variables._hcp_default_entity_undefined) {
                      return {};
                    } else if (variables.hcp_bravia_tv_config_sec1_01_command !== "") {
                      return { "command": variables.hcp_bravia_tv_config_sec1_01_command };
                    } else {
                      return {};
                    }
                  ]]]
              icon: >
                [[[
                    if (typeof variables.hcp_bravia_tv_config_sec1_01_ismute === variables._hcp_default_entity_undefined) {
                      return variables.hcp_bravia_tv_config_sec1_01_icon;
                    } else {
                      if (!variables.ulm_active_state || states[variables.card_hcp_bravia_tv_sound_entity].attributes.is_volume_muted){
                        return variables.hcp_bravia_tv_config_sec1_01_mute_on_icon;
