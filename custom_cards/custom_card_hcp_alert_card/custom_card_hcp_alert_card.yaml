---
### HCP Binary Sensor Alert Card ###
card_hcp_alert:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "hcp_global_defaults"
  show_last_changed: false
  show_name: false
  show_label: false
  show_icon: false
  tap_action:
    action: none
  variables:
    _card_hcp_alert_effective_severity: >
      [[[
        var sev = entity.attributes.severity;
        var notHomeSev = entity.attributes.not_home_severity;
        // You'd need is_home state - but that's a framework entity we can reference
        var isHome = states['binary_sensor.automated_alert_home'] 
          ? states['binary_sensor.automated_alert_home'].state === 'on' 
          : true; // default to home if unavailable
        return (!isHome && notHomeSev && notHomeSev !== '') ? notHomeSev : sev;
      ]]]
    card_hcp_show_last_changed: false
    card_hcp_alert_icon: >
      [[[
        var severity = variables._card_hcp_alert_effective_severity;
        if (!severity || severity === variables._hcp_default_automated_alert_severity_critical )
          return variables._hcp_default_automated_alert_severity_critical_icon
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_security )
          return variables._hcp_default_automated_alert_severity_security_icon
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_major )
          return variables._hcp_default_automated_alert_severity_major_icon
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_minor )
          return variables._hcp_default_automated_alert_severity_minor_icon
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_action )
          return variables._hcp_default_automated_alert_severity_action_icon
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_info )
          return variables._hcp_default_automated_alert_severity_info_icon
        else
          return variables._hcp_default_automated_alert_severity_default_icon
        endif
      ]]]
    card_hcp_alert_message: "[[[ return entity.attributes.message ]]]"
    card_hcp_alert_name: "[[[ return entity.attributes.friendly_name ]]]"
    card_hcp_alert_severity: "[[[ return variables._card_hcp_alert_effective_severity ]]]"
    card_hcp_alert_tag: "[[[ return entity.attributes?.tag ]]]"
    card_hcp_alert_status_helper: "[[[ return entity.attributes?.status_helper ]]]"
    card_hcp_alert_status: >
      [[[ 
        var helper = entity.attributes.status_helper;
        if (!helper || helper === '') return 'notified';
        var s = states[helper] ? states[helper].state : '';
        return ['idle', 'suppressed', 'skipped', 'notified', 'acknowledged'].includes(s) ? s : 'notified';
      ]]]
    card_hcp_alert_icon_color: >
      [[[
        var severity = variables._card_hcp_alert_effective_severity;
        if (!severity || severity === variables._hcp_default_automated_alert_severity_critical )
          return "color_hcp_automated_alert_critical"
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_security )
          return "color_hcp_automated_alert_security"
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_major )
          return "color_hcp_automated_alert_major"
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_minor )
          return "color_hcp_automated_alert_minor"
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_action )
          return "color_hcp_automated_alert_action"
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_info )
          return "color_hcp_automated_alert_info"
        else
          return "color_hcp_automated_alert_default"
        endif
      ]]]
    card_hcp_alert_text_color: >
      [[[
        var severity = variables._card_hcp_alert_effective_severity;;
        if (!severity || severity === variables._hcp_default_automated_alert_severity_critical )
          return "color_hcp_automated_alert_critical";
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_security )
          return "color_hcp_automated_alert_security";
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_major )
          return "color_hcp_automated_alert_major";
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_minor )
          return "color_hcp_automated_alert_minor";
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_action )
          return "color_hcp_automated_alert_action";
        else if (!severity || severity === variables._hcp_default_automated_alert_severity_info )
          return "color_hcp_automated_alert_info";
        else
          return "color_hcp_automated_alert_default";
        endif
      ]]]
    card_hcp_alert_padding: "var(--hcp_minimalist_default_padding)"
    card_hcp_alert_row_gap: "var(--hcp_minimalist_default_row_gap)"
    card_hcp_alert_show_indicator: "[[[ return variables._hcp_default_show_indicator ]]]"
    ulm_name_tap_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_icon_tap_action: "popup"
    ulm_icon_hold_action: "popup"
    ulm_custom_popup:
      template: popup_hcp_history
  styles:
    grid:
      - grid-template-areas: '"item1 silence"'
      - grid-template-columns: "4fr 1fr"
      - grid-template-rows: "min-content"
      - row-gap: "[[[ return variables.card_hcp_alert_row_gap ]]]"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "[[[ return variables.card_hcp_alert_padding ]]]"
      - border-style: none
      - background-color: transparent
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        template:
          - "hcp_icon_info"
        entity: "[[[ return entity.entity_id ]]]"
        variables:
          hcp_icon_info_name: "[[[ return variables.card_hcp_alert_message; ]]]"
          hcp_icon_info_icon: "[[[ return variables.card_hcp_alert_icon; ]]]"
          hcp_icon_info_icon_color: "[[[ return variables.card_hcp_alert_icon_color ]]]"
          hcp_icon_info_text_color: "[[[ return variables.card_hcp_alert_text_color ]]]"
          hcp_icon_info_label: "[[[ return variables.card_hcp_alert_status; ]]]"
          hcp_icon_info_show_indicator: "[[[ return variables.card_hcp_alert_show_indicator ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action; ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action; ]]]"
          ulm_icon_tap_target: "[[[ return variables.ulm_icon_tap_target; ]]]"
          ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
          ulm_icon_tap_action: >
            [[[
              var severity = variables._card_hcp_alert_effective_severity;;
              if (!severity || 
                severity === variables._hcp_default_automated_alert_severity_action ||
                severity === variables._hcp_default_automated_alert_severity_security )
                return "perform-action";
              else
                return variables.ulm_icon_tap_action;
              endif
            ]]]
          ulm_icon_tap_service: >
            [[[
              var severity = variables._card_hcp_alert_effective_severity;;
              if (!severity || 
                severity === variables._hcp_default_automated_alert_severity_action ||
                severity === variables._hcp_default_automated_alert_severity_security )
                return "input_boolean.turn_off";
              else
                return variables.ulm_icon_tap_service;
              endif
            ]]]
          ulm_icon_tap_target: >
            [[[
              var severity = variables._card_hcp_alert_effective_severity;;
              if (!severity || 
                severity === variables._hcp_default_automated_alert_severity_action ||
                severity === variables._hcp_default_automated_alert_severity_security )
                return entity.attributes.trigger_entity;
              else
                return variables.ulm_icon_tap_target;
              endif
            ]]]
    silence:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "hcp_widget_button"
          - "color_hcp_switch_default"
        icon: >
          [[[
            var status = variables.card_hcp_alert_status
            if (!status || status === "idle" )
              return variables._hcp_default_automated_alert_idle_icon;
            else if (!status || status === "suppressed" )
              return variables._hcp_default_automated_alert_suppressed_icon;
            else if (!status || status === "skipped" )
              return variables._hcp_default_automated_alert_skipped_icon;
            else if (!status || status === "notified" )
              return variables._hcp_default_automated_alert_notified_icon;
            else if (!status || status === "acknowledged" )
              return variables._hcp_default_automated_alert_acknowledged_icon;
            else
              return variables._hcp_default_automated_alert_default_icon;
            endif
          ]]]
        tap_action:
          action: >
            [[[
              const excludeSeverities = ['info']
              if (variables.card_hcp_alert_status === "acknowledged" || excludeSeverities.includes(variables.card_hcp_alert_severity)) {
                  return "";
              } else {
                  return "perform-action";
              }
            ]]]
          perform_action: script.alert_clear
          data:
            tag: "[[[ return variables.card_hcp_alert_tag ]]]"
            acknowledged: true
            status_helper: "[[[ return variables.card_hcp_alert_status_helper ]]]"
