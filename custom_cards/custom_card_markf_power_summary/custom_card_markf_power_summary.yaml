---
# Card for Power Summary - markf UI standard #
card_markf_power_summary:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "markf_global_defaults"
  show_name: false
  show_label: false
  show_icon: false
  tap_action:
    action: none
  variables:
    card_markf_power_summary_area_name: "[[[ return entity.attributes?.area_name; ]]]"
    card_markf_power_summary_light_on: "[[[ return entity.attributes?.lights_on; ]]]"
    card_markf_power_summary_light_label: >
      [[[ 
        return entity.attributes?.lights_on + "/" + entity.attributes?.lights_count;
      ]]]
    card_markf_power_summary_ppoint_on: "[[[ return entity.attributes?.power_points_on; ]]]"
    card_markf_power_summary_ppoint_label: >
      [[[ 
        return entity.attributes?.power_points_on + "/" + entity.attributes?.power_points_count;
      ]]]
    card_markf_power_summary_fan_on: "[[[ return entity.attributes?.fan_power_switches_on; ]]]"
    card_markf_power_summary_fan_label: >
      [[[ 
        return entity.attributes?.fan_power_switches_on + "/" + entity.attributes?.fan_power_switches_count;
      ]]]
    card_markf_power_summary_total_label: >
      [[[ 
        var entities_on = Number(entity.attributes?.lights_on) + Number(entity.attributes?.power_points_on) + Number(entity.attributes?.fan_power_switches_on)
        var entities_count = Number(entity.attributes?.lights_count) + Number(entity.attributes?.power_points_count) + Number(entity.attributes?.fan_power_switches_count)
        return entities_on.toString() + "/" + entities_count.toString()
      ]]]
    card_markf_power_summary_color: "color_markf_icon_info_active_ok_inactive_alert"
    card_markf_power_summary_total_color: "color_markf_chip_state_default"
    card_markf_power_summary_sensor_color: "color_markf_icon_info_active_ok_inactive_alert"
    ulm_icon_tap_action: "popup"
    ulm_name_tap_action: "popup"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: popup_markf_history

  styles:
    grid:
      - grid-template-areas: "'item1 item2' 'item3 item3'"
      - grid-template-columns: "4fr 1fr"
      - grid-template-rows: "min-content min-content"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--markf_minimalist_default_padding)"

  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id; ]]]"
        template:
          - "markf_icon_info"
          - "ulm_actions_name"
        variables:
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select ]]]"
          ulm_custom_popup: "[[[ return variables.ulm_custom_popup ]]]"
          markf_icon_info_name: "[[[ return variables.card_markf_power_summary_area_name; ]]]"
          markf_icon_info_icon_color: "[[[ return variables.card_markf_power_summary_color ]]]"
          markf_icon_info_show_indicator: "[[[ return variables.card_markf_power_summary_show_indicator;]]]"
          markf_icon_info_label: null
          markf_icon_info_icon: "[[[ return variables._markf_default_power_entity_icon.toString(); ]]]"

    item2:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id; ]]]"
        template: >
          [[[
            var templates = ["markf_widget_label", "ulm_actions_name"]
            templates.push(variables.card_markf_power_summary_total_color)
            return templates;
          ]]]
        variables:
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select ]]]"
          ulm_custom_popup: "[[[ return variables.ulm_custom_popup ]]]"
          markf_widget_icon_label_label: "[[[ return variables.card_markf_power_summary_total_label; ]]]"

    item3:
      card:
        type: "custom:button-card"
        template: "markf_list_3x1_items"
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id; ]]]"
              icon: "[[[ return variables._markf_default_power_light_icon; ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_markf_power_summary_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                markf_widget_icon_label_label: "[[[ return variables.card_markf_power_summary_light_label;  ]]]"
#
          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id; ]]]"
              icon: "[[[ return variables._markf_default_power_socket_icon; ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_markf_power_summary_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
                markf_widget_icon_label_label: "[[[ return variables.card_markf_power_summary_ppoint_label ]]]"

          item3:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id; ]]]"
              icon: "[[[ return variables._markf_default_power_fan_icon; ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon_label", "ulm_actions_icon"]
                  templates.push(variables.card_markf_power_summary_sensor_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
