---
### List 3x2 Items ###
markf_list_3x2_items:
  styles:
    grid:
      - grid-template-areas: "'item1 item2 item3' 'item4 item5 item6'"
      - grid-template-columns: "1fr 1fr 1fr"
      - grid-template-rows: "min-content min-content"
      - column-gap: "var(--markf_minimalist_default_column_gap)"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    card:
      - margin-top: "0px"
      - box-shadow: "none"
      - padding: var(--markf_minimalist_card_bottom_padding)
      - border-style: none
      - background-color: transparent
