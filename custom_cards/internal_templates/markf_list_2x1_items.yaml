---
### List 2x1 Items ###
markf_list_2x1_items:
  styles:
    grid:
      - grid-template-areas: "'item1 item2'"
      - grid-template-columns: "min-content auto"
      - grid-template-rows: "min-content"
      - column-gap: "var(--markf_minimalist_default_column_gap)"
    card:
      - margin-top: "0px"
      - box-shadow: "none"
      - padding: var(--markf_minimalist_card_bottom_padding)
      - border-style: none
      - background-color: transparent
