---
### List 5 x 4 ###
hcp_list_5x4_items:
  styles:
    grid:
      - grid-template-areas: "'item1 item2 item3 item4 item5' 'item6 item7 item8 item9 item10' 'item11 item12 item13 item14 item15' 'item16 item17 item18 item19 item20'"
      - grid-template-columns: "1fr 1fr 1fr 1fr 1fr"
      - grid-template-rows: "min-content min-content min-content min-content"
      - column-gap: "var(--hcp_minimalist_default_column_gap)"
      - row-gap: "var(--hcp_minimalist_default_row_gap)"
    card:
      - margin-top: "0px"
      - box-shadow: "none"
      - padding: var(--hcp_minimalist_card_bottom_padding)
      - border-style: none
      - background-color: transparent
