---
### Markf widget Icon Label ###
markf_widget_icon_label:
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
  variables:
    markf_widget_icon_label_indicator_state: "[[[ return variables.ulm_translation_unavailable ]]]"
    markf_widget_icon_label_indicator_icon: "[[[ return variables._markf_default_indicator_icon ]]]"
    markf_widget_icon_label_indicator_size: "var(--markf_minimalist_widget_icon_indicator_size)"
    markf_widget_icon_label_indicator_color: "var(--markf_minimalist_widget_icon_indicator_color)"
    markf_widget_icon_label_indicator_pos_left: "var(--markf_minimalist_widget_icon_indicator_pos_left)"
    markf_widget_icon_label_indicator_pos_top: "var(--markf_minimalist_widget_icon_indicator_pos_top)"
    markf_widget_icon_label_indicator_font_size: "var(--markf_minimalist_widget_icon_indicator_font_size)"
    markf_widget_icon_label_label: "[[[ return entity.attributes?.friendly_name; ]]]"
  show_icon: true
  show_name: false
  show_label: true
  label: "[[[ return variables.markf_widget_icon_label_label; ]]]"
  styles:
    grid:
      - grid-template-areas: "'i' 'l'"
      - grid-template-columns: "auto"
      - grid-template-rows: "min-content min-content"
      - row-gap: "0px"
    card:
      - box-shadow: "none"
      - padding: "0px"
      - border-radius: "none"
      - border-style: none
      - background-color: transparent
    img_cell:
      - border-radius: "50%"
      - place-self: "center"
      - width: "42px"
      - height: "42px"
    label:
      - justify-self: "center"
      - align-self: "start"
      - font-size: "var(--markf_minimalist_label_font_size)"
      - font-weight: "var(--markf_minimalist_label_font_weight)"
      - text-overflow: "initial"
      - overflow: "initial"
      - text-transform: "capitalize"
    custom_fields:
      notification:
        - position: "absolute"
        - left: "var(--markf_minimalist_widget_icon_indicator_pos_left)"
        - top: "var(--markf_minimalist_widget_icon_indicator_pos_top)"
        - height: "var(--markf_minimalist_widget_icon_indicator_size)"
        - width: "var(--markf_minimalist_widget_icon_indicator_size)"
        - border: "none"
        - font-size: "var(--markf_minimalist_widget_icon_indicator_font_size)"
  custom_fields:
    notification: >
      [[[
        if (variables.ulm_translation_state === variables.markf_widget_icon_label_indicator_state && variables.widget_markf_show_indicator ){
          let var_icon = '"' + variables.markf_widget_icon_label_indicator_icon + '"'
          let var_size = variables.markf_widget_icon_label_indicator_size
          let var_color = "rgba(" + variables.markf_widget_icon_label_indicator_color + ",1)"
          return `<ha-icon icon= ${var_icon} style="width: ${var_size}; height: ${var_size}; color: ${var_color};"></ha-icon>`
        }
      ]]]
  size: "20px"
