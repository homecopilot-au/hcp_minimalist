---
### List 2x3 Items ###
markf_list_2x3_items:
  styles:
    grid:
      - grid-template-areas: "'item1 item2' 'item3 item4' 'item5 item6'"
      - grid-template-columns: "min-content min-content"
      - grid-template-rows: "min-content min-content min-content"
      - column-gap: "var(--markf_minimalist_default_column_gap)"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    card:
      - margin-top: "0px"
      - box-shadow: "none"
      - padding: var(--markf_minimalist_card_bottom_padding)
      - width: 108px
      - border-style: none
      - background-color: transparent
