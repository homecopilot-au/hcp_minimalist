---
### List 3 Items ###
hcp_list_3_items:
  styles:
    grid:
      - grid-template-areas: "'item1 item2 item3'"
      - grid-template-columns: "1fr 1fr 1fr"
      - grid-template-rows: "min-content"
      - column-gap: "var(--hcp_minimalist_default_column_gap)"
    card:
      - box-shadow: "none"
      - padding: "0px 0px 2px 0px"
