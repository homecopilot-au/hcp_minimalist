---
### Markf widget button ###
markf_widget_button:
  template: 
    - "ulm_translation_engine"
    - "markf_global_defaults"
  show_icon: true
  show_label: false
  show_name: false
  styles:
    grid:
      - grid-template-areas: "'i'"
    card:
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--markf_minimalist_default_icon_padding)"
      - border-radius: "var(--markf_minimalist_icon_border_radius)"
      - place-self: "center"
      - height: "42px"
  size: "20px"
