---
### List 1x2 Items ###
hcp_list_1x2_items:
  styles:
    grid:
      - grid-template-areas: "'item1' 'item2'"
      - grid-template-columns: "1fr"
      - grid-template-rows: "min-content min-content"
      - row-gap: "var(--hcp_minimalist_default_row_gap)"
    card:
      - margin-top: "0px"
      - box-shadow: "none"
      - padding: "var(--hcp_minimalist_default_padding)"
      - border-style: none
      - background-color: transparent
