---
### HCP widget State ###
hcp_widget_label:
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
  show_icon: false
  show_label: true
  show_name: false
  show_state: false
  variables:
    hcp_widget_label_label: "[[[ return entity.attributes?.friendly_name; ]]]"
  label: "[[[ return variables.hcp_widget_icon_label_label; ]]]"
  styles:
    grid:
      - grid-template-areas: "'l'"
      - grid-template-columns: "1fr"
      - grid-template-rows: "1fr"
    card:
      - box-shadow: "none"
      - border-radius: "none"
      - width: "42px"
      - height: "42px"
    label:
      - justify-self: "center"
      - align-self: "start"
      - font-size: "var(--hcp_minimalist_label_font_size)"
      - font-weight: "var(--hcp_minimalist_label_font_weight)"
      - margin-top: "var(--hcp_minimalist_default_padding)"
      - white-space: "initial"
      - text-overflow: "initial"
      - overflow: "initial"
      - text-transform: "capitalize"
  size: "20px"
