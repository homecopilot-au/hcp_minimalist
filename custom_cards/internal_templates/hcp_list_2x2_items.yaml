---
### List 2x2 Items ###
hcp_list_2x2_items:
  styles:
    grid:
      - grid-template-areas: "'item1 item2' 'item3 item4'"
      - grid-template-columns: "min-content min-content"
      - grid-template-rows: "min-content min-content"
      - column-gap: "var(--hcp_minimalist_default_column_gap)"
      - row-gap: "var(--hcp_minimalist_default_row_gap)"
    card:
      - margin-top: "0px"
      - box-shadow: "none"
      - padding: var(--hcp_minimalist_card_bottom_padding)
      - border-style: none
      - background-color: transparent
