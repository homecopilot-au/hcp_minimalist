### Widget Icon Info ###
markf_widget_info:
  show_icon: false
  show_label: true
  show_name: true
  styles:
    grid:
      - grid-template-areas: "'i n' 'i l'"
      - grid-template-columns: "min-content auto"
      - grid-template-rows: "min-content min-content"
    card:
      - border-radius: "none"
      - box-shadow: "none"
      - padding: "0px 0px 0px 6px"
      - border-style: none
      - background-color: transparent
    label:
      - justify-self: "start"
      - align-self: "start"
      - font-size: "var(--markf_minimalist_label_font_size)"
      - font-weight: "var(--markf_minimalist_label_font_weight)"
      - filter: "opacity(var(--markf_minimalist_label_opacity))"
      - text-transform: "capitalize"
    name:
      - justify-self: "start"
      - align-self: "start"
      - font-size: "var(--markf_minimalist_name_font_size)"
      - font-weight: "var(--markf_minimalist_name_font_weight)"
  size: "20px"
