---
### Global defaults ###
markf_global_defaults:
  variables:
    # General
    _markf_default_date_format: "en-AU"
    _markf_default_entity_undefined: "undefined"
    _markf_default_entity_string: "string"
    _markf_default_unavailable_icon: "mdi:cancel"
    _markf_default_power_entity_icon: "mdi:power"
    _markf_default_power_consumption_icon: "mdi:flash"
    _markf_default_power_light_icon: mdi:lightbulb
    _markf_default_power_socket_icon: mdi:power-socket-au
    _markf_default_power_fan_icon: mdi:fan
    
    # 3speedfan presets
    _markf_default_3speedfan_speed_1_preset: "low"
    _markf_default_3speedfan_speed_2_preset: "medium"
    _markf_default_3speedfan_speed_3_preset: "high"
    _markf_default_3speedfan_speed_1_icon: "mdi:fan-speed-1"
    _markf_default_3speedfan_speed_2_icon: "mdi:fan-speed-2"
    _markf_default_3speedfan_speed_3_icon: "mdi:fan-speed-3"

    # Aircon
    _markf_default_aircon_off_icon: mdi:hvac-off
    _markf_default_aircon_heat_icon: mdi:weather-sunny
    _markf_default_aircon_cool_icon: mdi:snowflake
    _markf_default_aircon_heat_cool_icon: mdi:fan-auto
    _markf_default_aircon_dry_icon: mdi:radiator
    _markf_default_aircon_fan_only_icon: mdi:fan
    _markf_default_aircon_temp_up_icon: mdi:thermometer-chevron-up
    _markf_default_aircon_temp_down_icon: mdi:thermometer-chevron-down

    # Alerts
    _markf_default_alert_icon: "mdi:bell-alert"

    # Automated Alerts
    _markf_default_automated_alert_idle_icon: "mdi:bell-off"
    _markf_default_automated_alert_suppressed_icon: "mdi:bell-cancel"
    _markf_default_automated_alert_skipped_icon: "mdi:bell-sleep"
    _markf_default_automated_alert_notified_icon: "mdi:bell-alert"
    _markf_default_automated_alert_acknowledged_icon: "mdi:bell-check"
    _markf_default_automated_alert_default_icon: "mdi:bell"
    _markf_default_automated_alert_severity_critical: "critical"
    _markf_default_automated_alert_severity_critical_icon: "mdi:alert-octagram"
    _markf_default_automated_alert_severity_security: "security"
    _markf_default_automated_alert_severity_security_icon: "mdi:cctv"
    _markf_default_automated_alert_severity_major: "major"
    _markf_default_automated_alert_severity_major_icon: "mdi:alert-circle"
    _markf_default_automated_alert_severity_action: "action"
    _markf_default_automated_alert_severity_action_icon: "mdi:check-circle"
    _markf_default_automated_alert_severity_minor: "minor"
    _markf_default_automated_alert_severity_minor_icon: "mdi:alert-circle-outline"
    _markf_default_automated_alert_severity_info: "info"
    _markf_default_automated_alert_severity_info_icon: "mdi:information"
    _markf_default_automated_alert_severity_default_icon: "mdi:help-circle"

    # Batteries
    _markf_default_battery_warn_level: 50
    _markf_default_battery_alert_level: 25
    _markf_default_battery_device_class: "battery"

    # Brightness
    _markf_default_brightsness_1_icon: "mdi:brightness-3"
    _markf_default_brightsness_2_icon: "mdi:brightness-2"
    _markf_default_brightsness_3_icon: "mdi:brightness-1"

    # Covers
    _markf_default_cover_open_icon: "mdi:arrow-down"
    _markf_default_cover_tilt_open_icon: "mdi:arrow-top-left"
    _markf_default_cover_close_icon: "mdi:arrow-up"
    _markf_default_cover_tilt_close_icon: "mdi:arrow-bottom-right"
    _markf_default_cover_stop_icon: "mdi:stop"
    _markf_default_cover_close_curtain_icon: "mdi:arrow-expand-horizontal"
    _markf_default_cover_open_curtain_icon: "mdi:arrow-collapse-horizontal"
    _markf_default_cover_unavailable_states: ["unknown", "unavailable"]
    _markf_default_cover_icon_open: >
      {
        "awning": "mdi:roller-shade",
        "blind": "mdi:blinds-open",
        "curtain": "mdi:curtains",
        "damper": "mdi:circle-outline",
        "door": "mdi:door-open",
        "garage": "mdi:garage-open",
        "gate": "mdi:gate-open",
        "shade": "mdi:roller-shade",
        "shutter": "mdi:window-shutter-open",
        "window": "mdi:window-open",
      };
    _markf_default_cover_icon_closed: >
      {
        "awning": "mdi:roller-shade-closed",
        "blind": "mdi:blinds",
        "curtain": "mdi:curtains-closed",
        "damper": "mdi:circle-slice-8",
        "door": "mdi:door-closed",
        "garage": "mdi:garage",
        "gate": "mdi:gate",
        "shade": "mdi:roller-shade-closed",
        "shutter": "mdi:window-shutter",
        "window": "mdi:window-closed",
      };

    # GTFS
    _markf_default_gtfs_warning_mins: 20
    _markf_default_gtfs_alert_mins: 10

    # Light
    _markf_default_light_more_options_icon: "mdi:dots-horizontal-circle-outline"

    # Lock
    _markf_default_lock_locked_icon: "mdi:lock"
    _markf_default_lock_unlocked_icon: "mdi:lock-open-variant"
    _markf_default_lock_unavailable_icon: "mdi:lock-open-alert-outline"
    _markf_default_lock_door_open_text: "Door Open"

    # Power on and off states used in customize
    _markf_default_power_normal_on_state: "On"
    _markf_default_power_normal_off_state: "Off"

    # Media player Sonos
    _markf_default_media_play_icon: "mdi:play"
    _markf_default_media_pause_icon: "mdi:pause"
    _markf_default_media_muted_icon: "mdi:volume-off"
    _markf_default_media_notmuted_icon: "mdi:volume-high"
    _markf_default_media_volume_up_icon: "mdi:volume-plus"
    _markf_default_media_volume_down_icon: "mdi:volume-minus"

    # Person
    _markf_default_person_icon: "mdi:face-man"
    _markf_default_person_home_icon: "mdi:home"
    _markf_default_person_away_icon: "mdi:home-off"

    # Popups
    _markf_default_popup_back_icon: "mdi:arrow-left"
    _markf_default_popup_history_icon: "mdi:chart-box-outline"
    _markf_default_popup_on_off_states: ["on", "off"]
    _markf_default_popup_brightness_label: "Brightness"
    _markf_default_popup_configuration_label: "Configuration"
    _markf_default_popup_diagnostic_label: "Diagnostic"
    _markf_default_popup_levels_label: "Levels"
    _markf_default_popup_replacement_label: "Replacement"
    _markf_default_popup_sensors_label: "Sensors"

    #Power graph card
    _markf_default_power_graph_hours: 24
    _markf_default_power_graph_type: "fill"
    _markf_default_power_graph_fill: true
    _markf_default_power_graph_points: "0.5"
    _markf_default_power_graph_group_by: "interval"
    _markf_default_power_graph_line_width: 5
    _markf_default_power_graph_enable: true
    _markf_default_power_graph_height: 120
    _markf_default_power_graph_units_of_measure: true
    _markf_default_power_graph_warn_pct_level: 10
    _markf_default_power_graph_alert_pct_level: 20
    _markf_default_power_graph_show_icon: true

    # Room Humidity
    _markf_default_room_humidity_warn_level: 80
    _markf_default_room_humidity_alert_level: 90

    # Room Temperature
    _markf_default_room_temp_warn_level: 30
    _markf_default_room_temp_alert_level: 40

    # Update card
    _markf_default_update_icon: "mdi:package-up"
    _markf_default_update_release_notes: "mdi:text"

    # Weather
    _markf_default_weather_forecast_hourly_name: "_hourly"
    _markf_default_weather_forecast_icon: "mdi:weather-partly-lightning"
    _markf_default_weather_radar_icon: "mdi:radar"

    # Widget
    _markf_default_show_icon_indicator: true
    _markf_default_indicator_icon: "mdi:circle"

    # Dishawasher Timer
    _markf_default_diswasher_warning_mins: 15
    _markf_default_diswasher_alert_mins: 5
