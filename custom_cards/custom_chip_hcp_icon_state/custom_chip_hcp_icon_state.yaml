---
### Chip Icon State ###
chip_hcp_icon_state:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
  show_icon: true
  show_label: true
  show_name: false
  show_state: false
  variables:
    chip_hcp_icon_state_icon: "[[[ return entity.attributes.icon ]]]"
    chip_hcp_icon_state_on_icon: "[[[ return entity.attributes.icon; ]]]"
    chip_hcp_icon_state_label: "[[[ return variables.ulm_translation_state; ]]]"
    chip_hcp_icon_show_state: false
    ulm_card_tap_action: "popup"
    ulm_card_hold_action: "popup"
    ulm_custom_popup:
      template: "popup_hcp_history"
      entity: "[[[ return entity.entity_id ]]]"
  triggers_update: "all"

  icon: |
    [[[ 
      if(variables.ulm_active_state) {
          return variables.chip_hcp_icon_state_on_icon
      } else {
        return variables.chip_hcp_icon_state_icon
      }
    ]]]
  label: |
    [[[ 
      var state = "";
      if (variables.chip_hcp_icon_show_state && entity.state){
        var state = variables.chip_hcp_icon_state_label;
      }
      return state;
    ]]]
  styles:
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - height: "36px"
      - width: "auto"
      - padding-left: "var(--hcp_minimalist_chip_icon_card_padding)"
      - padding-right: "var(--hcp_minimalist_chip_icon_card_padding)"
    grid:
      - grid-template-areas: "'i l'"
    label:
      - justify-self: "center"
      - font-weight: "var(--hcp_minimalist_chip_icon_font_weight)"
      - font-size: "var(--hcp_minimalist_chip_icon_font_size)"
      - line-height: "100%"
      - padding-left: "var(--hcp_minimalist_chip_icon_card_padding)"
      - padding-right: "var(--hcp_minimalist_chip_icon_card_padding)"
    img_cell:
      - width: "24px"
      - height: "24px"
      - border-radius: "50%"
      - place-self: "center"
  size: "80%"
