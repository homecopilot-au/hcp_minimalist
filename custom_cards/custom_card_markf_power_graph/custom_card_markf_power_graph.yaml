---
### Card Graph ###
card_markf_power_graph:
  template:
    - "ulm_translation_engine"
    - "ulm_custom_actions"
    - "ulm_actions_card"
    - "markf_global_defaults"
  show_icon: false
  show_name: false
  show_label: false
  show_state: false
  triggers_update: "all"
  variables:
    _card_markf_power_graph_use_area_name: false
    _card_markf_power_graph_area_name: >
      [[[ 
        const entityObj = hass.entities?.[entity.entity_id];
        const deviceId = entityObj?.device_id;
        const areaId = entityObj?.area_id || hass.devices?.[deviceId]?.area_id;
        return hass.areas?.[areaId]?.name;
      ]]]    
    card_markf_power_graph_name: >
      [[[
        if (variables._card_markf_power_graph_use_area_name) {
          return variables._card_markf_power_graph_area_name;
        } else { 
          return entity.attributes?.friendly_name;
        }
      ]]]
    card_markf_power_graph_icon: "[[[ return entity.attributes?.icon; ]]]"
    card_markf_power_graph_show_icon: "[[[ return variables._markf_default_power_graph_show_icon ]]]"
    card_markf_power_graph_icon_pct_entity: >
      [[[ 
        if(typeof(states[entity.entity_id].attributes?.area_pct) === "undefined") {
          return null;
        } else {
          return states[entity.entity_id].attributes?.area_pct;
        }
      ]]]
    card_markf_power_graph_state_color: "color_markf_graph_power"
    card_markf_power_graph_icon_color: "color_markf_icon_default"
    card_markf_power_graph_text_color: "color_markf_card_text_default"
    card_markf_power_graph_warn_level: "[[[ return variables._markf_default_power_graph_warn_pct_level; ]]]"
    card_markf_power_graph_alert_level: "[[[ return variables._markf_default_power_graph_alert_pct_level; ]]]"
    card_markf_power_graph_line_default_color: "var(--markf_minimalist_power_graph_line_default_color)"
    card_markf_power_graph_line_ok_color: "var(--markf_minimalist_power_graph_line_ok_color)"
    card_markf_power_graph_line_warn_color: "var(--markf_minimalist_power_graph_line_warn_color)"
    card_markf_power_graph_line_alert_color: "var(--markf_minimalist_power_graph_line_alert_color)"
    card_markf_power_graph_hours: "[[[ return variables._markf_default_power_graph_hours ]]]"
    card_markf_power_graph_type: "[[[ return variables._markf_default_power_graph_type ]]]"
    card_markf_power_graph_fill: "[[[ return variables._markf_default_power_graph_fill ]]]"
    card_markf_power_graph_points: "[[[ return variables._markf_default_power_graph_points ]]]"
    card_markf_power_graph_group_by: "[[[ return variables._markf_default_power_graph_group_by ]]]"
    card_markf_power_graph_line_width: "[[[ return variables._markf_default_power_graph_line_width ]]]"
    card_markf_power_graph_enable: "[[[ return variables._markf_default_power_graph_enable ]]]"
    card_markf_power_graph_height: "[[[ return variables._markf_default_power_graph_height ]]]"
    card_markf_power_graph_padding: "var(--markf_minimalist_default_padding)"
    card_markf_power_graph_no_padding: "0px"
    card_markf_power_graph_row_gap: "var(--markf_minimalist_default_row_gap)"
    card_markf_power_graph_no_row_gap: "0px"
    card_markf_power_graph_show_title: true
    card_markf_power_graph_show_name: false
    card_markf_power_graph_show_indicator: "[[[ return variables._markf_default_show_indicator ]]]"
    card_markf_power_graph_show_uom: "[[[ return variables._markf_default_power_graph_units_of_measure ]]]"
    ulm_icon_tap_action: "toggle"
    ulm_name_tap_action: "toggle"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: popup_markf_history
  styles:
    grid:
      - grid-template-areas: >
          [[[
            var areas = [];
            areas.push("item1");
            if (variables.card_markf_power_graph_enable) {
                areas.push("item2");
            }
            return "\"" + areas.join("\" \"") + "\"";
          ]]]
      - grid-template-columns: "1fr"
      - grid-template-rows: >
          [[[
            var rows = [];
            rows.push("min-content");
            if (variables.card_markf_power_graph_enable) {
                rows.push("min-content");
            }
            return rows.join(" ");
          ]]]
      - row-gap: |-
          [[[
            if(variables.card_markf_power_graph_show_title)
              return variables.card_markf_power_graph_row_gap;
            else
              return variables.card_markf_power_graph_no_row_gap;
          ]]]
    card:
      - border-radius: "var(--border-radius)"
      - padding: "[[[ return variables.card_markf_power_graph_padding; ]]]"
#      - padding: |-
#          [[[
#            if(variables.card_markf_power_graph_show_title)
#              return variables.card_markf_power_graph_padding;
#            else
#              return variables.card_markf_power_graph_no_padding;
#          ]]]
      - border-style: none
      - background-color: transparent
    custom_fields:
      item1:
        - display: >
            [[[
              if (variables.card_markf_power_graph_show_title) {
                  return "block";
              } else {
                  return "none";
              }
            ]]]
      item2:
        - display: >
            [[[
              if (variables.card_markf_power_graph_enable) {
                  return "block";
              } else {
                  return "none";
              }
            ]]]

  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id; ]]]"
        template: >
          [[[
            var templates = [];
            if (variables.card_markf_power_graph_icon_pct_entity) {
              templates.push("markf_state_info");
              templates.push("ulm_actions_name");
            } else {
              templates.push("markf_icon_info");
              templates.push("ulm_actions_icon");
            }
            return templates;
          ]]]

        variables:
          markf_state_info_state_entity: "[[[ return variables.card_markf_power_graph_icon_pct_entity; ]]]"
          markf_state_info_state_color: "[[[ return variables.card_markf_power_graph_state_color; ]]]"
          markf_state_info_name: "[[[ return variables.card_markf_power_graph_name; ]]]"
          markf_state_info_text_color: "[[[ return variables.card_markf_power_graph_text_color; ]]]"
          markf_state_info_show_indicator: "[[[ return variables.card_markf_power_graph_show_indicator;]]]"
          markf_state_info_label_unit_of_measurement: "[[[ return variables.card_markf_power_graph_show_uom;]]]"
          markf_icon_info_icon_color: "[[[ return variables.card_markf_power_graph_icon_color; ]]]"
          markf_icon_info_text_color: "[[[ return variables.card_markf_power_graph_text_color; ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
          ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
          ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
          ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
          ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
          ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
          ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
          ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
          ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
          ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
          ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
          ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
          ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
          ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action; ]]]"
          ulm_name_tap_haptic: "[[[ return variables.ulm_name_tap_haptic; ]]]"
          ulm_name_tap_navigate_path: "[[[ return variables.ulm_name_tap_navigate_path; ]]]"
          ulm_name_tap_service: "[[[ return variables.ulm_name_tap_service; ]]]"
          ulm_name_tap_service_data: "[[[ return variables.ulm_name_tap_service_data; ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action; ]]]"
          ulm_name_hold_haptic: "[[[ return variables.ulm_name_hold_haptic; ]]]"
          ulm_name_hold_navigate_path: "[[[ return variables.ulm_name_hold_navigate_path; ]]]"
          ulm_name_hold_service: "[[[ return variables.ulm_name_hold_service; ]]]"
          ulm_name_hold_service_data: "[[[ return variables.ulm_name_hold_service_data; ]]]"
          ulm_name_double_tap_action: "[[[ return variables.ulm_name_double_tap_action; ]]]"
          ulm_name_double_tap_haptic: "[[[ return variables.ulm_name_double_tap_haptic; ]]]"
          ulm_name_double_tap_navigate_path: "[[[ return variables.ulm_name_double_tap_navigate_path; ]]]"
          ulm_name_double_tap_service: "[[[ return variables.ulm_name_double_tap_service; ]]]"
          ulm_name_double_tap_service_data: "[[[ return variables.ulm_name_double_tap_service_data; ]]]"
          ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
    item2:
      card:
        type: "custom:mini-graph-card"
        height: "[[[ return variables.card_markf_power_graph_height ]]]"
        group: true
        name: "[[[ return variables.card_markf_power_graph_name; ]]]"
        align_header: center
        entities: >
          [[[
            var ent = [];
            ent.push(entity.entity_id);
            return ent;
          ]]]
        line_color: >
          [[[
            var area_pct_state = 0;
            var col = [];
            if (variables.card_markf_power_graph_icon_pct_entity) {
              area_pct_state = states[variables.card_markf_power_graph_icon_pct_entity].state;
            } else {
              col.push(variables.card_markf_power_graph_line_default_color);
            }
            if (area_pct_state > variables.card_markf_power_graph_alert_level) {
              col.push(variables.card_markf_power_graph_line_alert_color);
            } else {
              if (area_pct_state > variables.card_markf_power_graph_warn_level) {
                col.push(variables.card_markf_power_graph_line_warn_color);
              } else {
                col.push(variables.card_markf_power_graph_line_ok_color);
              }
            }
            return col;
          ]]]
        hours_to_show: "[[[ return variables.card_markf_power_graph_hours; ]]]"
        points_per_hour: "[[[ return variables.card_markf_power_graph_points; ]]]"
        show:
          name: "[[[ return variables.card_markf_power_graph_show_name; ]]]"
          icon: false
          legend: false
          state: false
          graph: "[[[ return variables.card_markf_power_graph_type; ]]]"
          fill: "[[[ return variables.card_markf_power_graph_fill; ]]]"
          group_by: "[[[ return variables.card_markf_power_graph_group_by; ]]]"
          line_width: "[[[ return variables.card_markf_power_graph_line_width; ]]]"
        card_mod:
          style: |
            ha-card {
              --ha-card-background: transparent;
            }