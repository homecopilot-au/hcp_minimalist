---
### Lock card - markf UI standard ###
card_markf_lock:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_icon"
    - "ulm_actions_name"
    - "markf_global_defaults"
  show_name: false
  show_label: false
  show_icon: false
  tap_action:
    action: none
  variables:
    _card_markf_lock_name: >
      [[[ 
        const entityObj = hass.entities?.[entity.entity_id];
        const deviceId = entityObj?.device_id;
        const areaId = entityObj?.area_id || hass.devices?.[deviceId]?.area_id;
        return hass.areas?.[areaId]?.name;
      ]]]
    _card_markf_lock_locked: "[[[ return hass.localize('component.lock.entity_component._.state.locked') ]]]"
    _card_markf_lock_unlocked: "[[[ return hass.localize('component.lock.entity_component._.state.unlocked') ]]]"
    _card_markf_lock_device_class: "[[[ return entity.entity_id.split('.')[0]; ]]]"  # Unifi access does not assign device_class to it's buttons so split entity id instead
    _card_markf_lock_door_open: "off"
    card_markf_lock_icon_color: >
      [[[
        if (variables._card_markf_lock_door_open.toLowerCase() === "off" || variables._card_markf_lock_device_class.toLowerCase() === "button"){
          return "color_markf_button_default";
        } else {
          return "color_markf_button_unavailable";
        }
      ]]]
    card_markf_lock_label: >
      [[[ 
        if (variables._card_markf_lock_door_open.toLowerCase() === "off"){
          if (variables._card_markf_lock_device_class.toLowerCase() === "button") {
            return variables._card_markf_lock_locked;
          } else {
            return variables.ulm_translation_state;
          }
        } else {
          return variables._markf_default_lock_door_open_text;
        }
      ]]]
    card_markf_lock_icon: >
      [[[ 
        if (variables._card_markf_lock_door_open.toLowerCase() === "off"){
          if (variables.ulm_translation_state.toLowerCase() === variables._card_markf_lock_locked.toLowerCase() || variables._card_markf_lock_device_class.toLowerCase() === "button") {
            return variables._markf_default_lock_unlocked_icon;
          } else {
            return variables._markf_default_lock_locked_icon;
          }
        } else {
          return variables._markf_default_lock_unavailable_icon;
        }
      ]]]
    card_markf_lock_padding: "var(--markf_minimalist_default_padding)"
    card_markf_lock_no_padding: "0px"
    card_markf_lock_row_gap: "var(--markf_minimalist_default_row_gap)"
    card_markf_lock_no_row_gap: "0px"
    card_markf_lock_show_indicator: "[[[ return variables._markf_default_show_indicator ]]]"
    ulm_icon_tap_action: >
      [[[
        if (variables._card_markf_lock_door_open.toLowerCase() === "off" || variables._card_markf_lock_device_class.toLowerCase() === "button"){
          return "call-service";
        } else {
          return "";
        }
      ]]]
    ulm_icon_tap_service: >
      [[[ 
        if (variables._card_markf_lock_device_class.toLowerCase() === "button") {
          return "button.press";
        } else if (variables.ulm_translation_state === variables._card_markf_lock_locked) {
          return "lock.unlock";
        } else {
          return "lock.lock";
        }
      ]]]
    ulm_icon_tap_target: "[[[ return entity.entity_id; ]]]"
    ulm_icon_hold_action: >
      [[[
        if (variables._card_markf_lock_door_open.toLowerCase() === "off" || variables._card_markf_lock_device_class.toLowerCase() === "button"){
          return "call-service";
        } else {
          return "";
        }
      ]]]
    ulm_icon_hold_target: "[[[ return entity.entity_id; ]]]"
    # Unifi Access Locks use buttons to toggle lock/unlock which is controlled by a button
    ulm_icon_hold_service: >
      [[[ 
        if (variables._card_markf_lock_device_class === "button") {
          return "button.press";
        } else if (variables.ulm_translation_state === variables._card_markf_lock_locked) {
          return "lock.unlock";
        } else {
          return "lock.lock";
        }
      ]]]
    ulm_name_tap_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: "popup_markf_history"
      entity: "[[[ return entity.entity_id ]]]"

  styles:
    grid:
      - grid-template-areas: '"item1"'
      - grid-template-rows: "min-content"
      - row-gap: "[[[ return variables.card_markf_alert_row_gap ]]]"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--markf_minimalist_default_padding)"
      - border-style: none
      - background-color: transparent
    custom_fields:
      item1:
        - align-self: "start"

  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "markf_icon_info"
          - "ulm_actions_name"
          - "ulm_actions_icon"
        variables:
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
          ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
          ulm_icon_tap_target: "[[[ return variables.ulm_icon_tap_target; ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
          ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
          ulm_icon_hold_target: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action; ]]]"
          ulm_name_tap_service: "[[[ return variables.ulm_name_tap_service; ]]]"
          ulm_name_tap_target: "[[[ return variables.ulm_name_tap_target; ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action; ]]]"
          ulm_name_hold_service: "[[[ return variables.ulm_name_hold_service; ]]]"
          ulm_name_hold_target: "[[[ return variables.ulm_name_hold_target; ]]]"
          ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
          markf_icon_info_label: "[[[ return variables.card_markf_lock_label; ]]]"
          markf_icon_info_name: "[[[ return variables._card_markf_lock_name; ]]]"
          markf_icon_info_icon: "[[[ return variables.card_markf_lock_icon; ]]]"
          markf_icon_info_icon_color: "[[[ return variables.card_markf_lock_icon_color ]]]"
          markf_icon_info_show_indicator: "[[[ return variables.card_markf_lock_show_indicator;]]]"

