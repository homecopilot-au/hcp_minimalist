---
### Card Person ###
card_markf_person:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "markf_global_defaults"
  variables:
    card_markf_person_use_entity_picture: false
    card_markf_person_name: "[[[ return entity.attributes.friendly_name; ]]]"
    card_markf_person_label: "[[[ return entity.state; ]]]"
    card_markf_person_icon: >
      [[[ 
        if (typeof entity.attributes.icon === variables._markf_default_entity_undefined) {
          return variables._markf_default_person_icon
        } else {
          return entity.attributes.icon;
        }
      ]]]
    card_markf_person_icon_color: "color_markf_person_default"
    card_markf_person_picture_color: "color_markf_person_picture"
    card_markf_person_text_color: "color_markf_icon_default"
    card_markf_person_icon_show_indicator: "[[[ return variables._markf_default_show_icon_indicator ]]]"
    card_markf_person_icon_indicator_on_color: "var(--markf_minimalist_person_icon_indicator_on_color)"
    card_markf_person_icon_indicator_off_color: "var(--markf_minimalist_person_icon_indicator_off_color)"
    card_markf_person_icon_indicator_pos_left: "var(--markf_minimalist_person_icon_indicator_pos_left)"
    card_markf_person_icon_indicator_pos_top: "var(--markf_minimalist_person_icon_indicator_pos_top)"
    card_markf_person_icon_indicator_size: "var(--markf_minimalist_person_icon_indicator_size)"
    card_markf_person_icon_indicator_font_size: "var(--markf_minimalist_person_icon_indicator_font_size)"
    card_markf_person_state_home: "[[[ return hass.localize('component.person.entity_component._.state.home') ]]]"
    card_markf_person_state_away: "[[[ return hass.localize('component.person.entity_component._.state.not_home') ]]]"
    ulm_icon_tap_action: "popup"
    ulm_name_tap_action: "popup"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_custom_popup:
      template: popup_markf_history
  triggers_update: "all"
  show_icon: false
  show_name: false
  show_label: false
  styles:
    grid:
      - grid-template-areas: '"item1"'
      - grid-template-columns: "auto"
      - grid-template-rows: "min-content"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--markf_minimalist_default_padding)"
      - border-style: none
      - background-color: transparent
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        show_icon: false
        show_name: false
        show_label: false
        template:
          - "markf_list_2x1_items"
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id; ]]]"
              icon: "[[[ return variables.card_markf_person_icon ]]]"
              show_entity_picture: "[[[ return variables.card_markf_person_use_entity_picture ]]]"
              entity_picture: "[[[ return variables.card_markf_person_use_entity_picture ? entity.attributes.entity_picture : null ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_icon", "ulm_actions_icon"]
                  if (!variables.card_markf_person_use_entity_picture) {
                    templates.push(variables.card_markf_person_icon_color);
                  } else {
                    templates.push(variables.card_markf_person_picture_color);
                  }
                  return templates;
                ]]]
              variables:
                widget_markf_show_indicator: "[[[ return variables.card_markf_person_icon_show_indicator ]]]"
                widget_markf_icon_indicator_state: >
                  [[[ 
                    if (variables.ulm_active_state) {
                      return variables.card_markf_person_state_home;
                    } else {
                      return variables.card_markf_person_state_away;
                    }
                  ]]]
                widget_markf_icon_indicator_icon: >
                  [[[ 
                    if (variables.ulm_active_state) {
                      return variables._markf_default_person_home_icon;
                    } else {
                      return variables._markf_default_person_away_icon;
                    }
                  ]]]
                widget_markf_icon_indicator_color: >
                  [[[ 
                    if (variables.ulm_active_state) {
                      return variables.card_markf_person_icon_indicator_on_color;
                    } else {
                      return variables.card_markf_person_icon_indicator_off_color;
                    }
                  ]]]
                widget_markf_icon_indicator_pos_left: "[[[ return variables.card_markf_person_icon_indicator_pos_left; ]]]"
                widget_markf_icon_indicator_pos_top: "[[[ return variables.card_markf_person_icon_indicator_pos_top; ]]]"
                widget_markf_icon_indicator_size: "[[[ return variables.card_markf_person_icon_indicator_size; ]]]"
                widget_markf_icon_indicator_font_size: "[[[ return variables.card_markf_person_icon_indicator_font_size; ]]]"
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action; ]]]"
                ulm_icon_tap_haptic: "[[[ return variables.ulm_icon_tap_haptic; ]]]"
                ulm_icon_tap_navigate_path: "[[[ return variables.ulm_icon_tap_navigate_path; ]]]"
                ulm_icon_tap_service: "[[[ return variables.ulm_icon_tap_service; ]]]"
                ulm_icon_tap_service_data: "[[[ return variables.ulm_icon_tap_service_data; ]]]"
                ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action; ]]]"
                ulm_icon_hold_haptic: "[[[ return variables.ulm_icon_hold_haptic; ]]]"
                ulm_icon_hold_navigate_path: "[[[ return variables.ulm_icon_hold_navigate_path; ]]]"
                ulm_icon_hold_service: "[[[ return variables.ulm_icon_hold_service; ]]]"
                ulm_icon_hold_service_data: "[[[ return variables.ulm_icon_hold_service_data; ]]]"
                ulm_icon_double_tap_action: "[[[ return variables.ulm_icon_double_tap_action; ]]]"
                ulm_icon_double_tap_haptic: "[[[ return variables.ulm_icon_double_tap_haptic; ]]]"
                ulm_icon_double_tap_navigate_path: "[[[ return variables.ulm_icon_double_tap_navigate_path; ]]]"
                ulm_icon_double_tap_service: "[[[ return variables.ulm_icon_double_tap_service; ]]]"
                ulm_icon_double_tap_service_data: "[[[ return variables.ulm_icon_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
              styles:
                card:
                  - overflow: >
                      [[[
                        if (variables.card_markf_person_icon_show_indicator){
                          return "visible";
                        } else {
                          return "hidden";
                        }
                      ]]]
          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              name: "[[[ return variables.card_markf_person_name; ]]]"
              label: >
                [[[ 
                  if (variables.ulm_active_state) {
                    return variables.card_markf_person_state_home;
                  } else {
                    return variables.card_markf_person_state_away;
                  }
                ]]]
              template: >
                [[[
                  var templates = ["markf_widget_info", "ulm_actions_name"]
                  templates.push(variables.card_markf_person_text_color)
                  return templates;
                ]]]
              variables:
                ulm_input_select_option: "[[[ return variables.ulm_input_select_option; ]]]"
                ulm_input_select: "[[[ return variables.ulm_input_select; ]]]"
                ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action; ]]]"
                ulm_name_tap_haptic: "[[[ return variables.ulm_name_tap_haptic; ]]]"
                ulm_name_tap_navigate_path: "[[[ return variables.ulm_name_tap_navigate_path; ]]]"
                ulm_name_tap_service: "[[[ return variables.ulm_name_tap_service; ]]]"
                ulm_name_tap_service_data: "[[[ return variables.ulm_name_tap_service_data; ]]]"
                ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action; ]]]"
                ulm_name_hold_haptic: "[[[ return variables.ulm_name_hold_haptic; ]]]"
                ulm_name_hold_navigate_path: "[[[ return variables.ulm_name_hold_navigate_path; ]]]"
                ulm_name_hold_service: "[[[ return variables.ulm_name_hold_service; ]]]"
                ulm_name_hold_service_data: "[[[ return variables.ulm_name_hold_service_data; ]]]"
                ulm_name_double_tap_action: "[[[ return variables.ulm_name_double_tap_action; ]]]"
                ulm_name_double_tap_haptic: "[[[ return variables.ulm_name_double_tap_haptic; ]]]"
                ulm_name_double_tap_navigate_path: "[[[ return variables.ulm_name_double_tap_navigate_path; ]]]"
                ulm_name_double_tap_service: "[[[ return variables.ulm_name_double_tap_service; ]]]"
                ulm_name_double_tap_service_data: "[[[ return variables.ulm_name_double_tap_service_data; ]]]"
                ulm_custom_popup: "[[[ return variables.ulm_custom_popup; ]]]"
