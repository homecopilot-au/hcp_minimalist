---
### Media player Sonos - markf UI standard ###
card_markf_media_player_sonos:
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
  variables:
    card_markf_media_player_sonos_name: "[[[ return entity.attributes.friendly_name ]]]"
    card_markf_media_player_sonos_text_color: "color_markf_card_text_default"
    card_markf_media_player_sonos_mute_button_color: "color_markf_button_sonos_mute"
    card_markf_media_player_sonos_button_color: "color_markf_button_default"
    card_markf_media_player_sonos_play_button_color: "color_markf_button_sonos_play"
    card_markf_media_player_sonos_muted_icon: "[[[ return variables._markf_default_media_muted_icon; ]]]"
    card_markf_media_player_sonos_notmuted_icon: "[[[ return variables._markf_default_media_notmuted_icon; ]]]"
    card_markf_media_player_sonos_play_icon: "[[[ return variables._markf_default_media_play_icon; ]]]"
    card_markf_media_player_sonos_pause_icon: "[[[ return variables._markf_default_media_pause_icon; ]]]"
    card_markf_media_player_sonos_device_name: ""
    card_markf_media_player_sonos_show_indicator: "[[[ return variables._markf_default_show_indicator; ]]]"
    card_markf_media_player_sonos_navigate_path: "music"
    card_markf_media_player_sonos_popup_card: "popup_markf_sonos"
  show_icon: false
  show_name: false
  show_label: false
  triggers_update: "all"
  styles:
    grid:
      - grid-template-areas: "'item1' 'item2'"
      - grid-template-columns: "1fr"
      - grid-template-rows: "min-content  min-content"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "var(--markf_minimalist_default_padding)"
      - border-style: none
      - background-color: transparent
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "markf_list_2x1_items"
        show_icon: false
        show_name: false
        show_label: false
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              icon: >
                [[[
                    if (!variables.ulm_active_state || states[entity.entity_id].attributes.is_volume_muted){
                      return variables.card_markf_media_player_sonos_muted_icon;
                    } else {
                      return variables.card_markf_media_player_sonos_notmuted_icon;
                    }
                ]]]
              template: >
                [[[
                  var templates = ["markf_widget_icon"]
                  templates.push(variables.card_markf_media_player_sonos_mute_button_color)
                  return templates;
                ]]]
              tap_action:
                action: "call-service"
                service: "media_player.volume_mute"
                service_data:
                  entity_id: "[[[ return entity.entity_id; ]]]"
                  is_volume_muted: "[[[ return (states[entity.entity_id].attributes.is_volume_muted) ? false : true; ]]]"
              hold_action:
                action: "fire-dom-event"
                browser_mod:
                  service: "browser_mod.popup"
                  data:
                    hide_header: true
                    style: |
                      --popup-background-color: var(--markf_minimalist_popup_background_color);
                      --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                      --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                      --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                      --popup-max-width: var(--markf_minimalist_popup_max_width);
                      --popup-min-width: var(--markf_minimalist_popup_min_width);;
                    size: >
                      [[[
                        const mediaQuery = window.matchMedia('(max-width: 1200px)')
                        if (mediaQuery.matches) {
                          return 'fullscreen'
                        }
                      ]]]
                    content:
                      type: "custom:button-card"
                      template: "[[[ return variables.card_markf_media_player_sonos_popup_card; ]]]"
                      entity: "[[[ return entity.entity_id; ]]]"
                      variables:
                        popup_markf_sonos_device_name: "[[[ return variables.card_markf_media_player_sonos_device_name; ]]]"
              styles:
                card:
                  - overflow: >
                      [[[
                        if (variables.ulm_translation_state === variables.ulm_translation_unavailable){
                          return "visible";
                        } else {
                          return "hidden";
                        }
                      ]]]
          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              name: "[[[ return variables.card_markf_media_player_sonos_name; ]]]"
              label: >-
                [[[
                  if(entity.attributes.media_title) {
                    return entity.attributes.media_title + ' • ' +  ( Math.round(entity.attributes.volume_level / 0.01)) + '%' ;
                  } else {
                    return variables.ulm_translation_state;
                  }
                ]]]
              template: >
                [[[
                  var templates = ["markf_widget_info"]
                  templates.push(variables.card_markf_media_player_sonos_text_color)
                  return templates;
                ]]]
              tap_action:
                action: "more-info"
              hold_action:
                action: "fire-dom-event"
                browser_mod:
                  service: "browser_mod.popup"
                  data:
                    hide_header: true
                    style: |
                      --popup-background-color: var(--markf_minimalist_popup_background_color);
                      --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                      --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                      --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                      --popup-max-width: var(--markf_minimalist_popup_max_width);
                      --popup-min-width: var(--markf_minimalist_popup_min_width);;
                    size: >
                      [[[
                        const mediaQuery = window.matchMedia('(max-width: 1200px)')
                        if (mediaQuery.matches) {
                          return 'fullscreen'
                        }
                      ]]]
                    content:
                      type: "custom:button-card"
                      template: "[[[ return variables.card_markf_media_player_sonos_popup_card; ]]]"
                      entity: "[[[ return entity.entity_id; ]]]"
                      variables:
                        popup_markf_sonos_device_name: "[[[ return variables.card_markf_media_player_sonos_device_name; ]]]"

    item2:
      card:
        type: "custom:button-card"
        template: "markf_list_3x1_items"
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              template: >
                [[[
                  var templates = ["markf_widget_button"]
                  templates.push(variables.card_markf_media_player_sonos_button_color)
                  return templates;
                ]]]
              entity: "[[[ return entity.entity_id ]]]"
              tap_action:
                action: "call-service"
                service: "media_player.volume_down"
                service_data:
                  entity_id: "[[[ return entity.entity_id ]]]"
              icon: "[[[ return variables._markf_default_media_volume_down_icon ]]]"
          item2:
            card:
              type: "custom:button-card"
              template: >
                [[[
                  var templates = ["markf_widget_button"]
                  templates.push(variables.card_markf_media_player_sonos_play_button_color)
                  return templates;
                ]]]
              entity: "[[[ return entity.entity_id ]]]"
              tap_action:
                action: "call-service"
                service: "media_player.media_play_pause"
                service_data:
                  entity_id: "[[[ return entity.entity_id ]]]"
          item3:
            card:
              type: "custom:button-card"
              template: >
                [[[
                  var templates = ["markf_widget_button"]
                  templates.push(variables.card_markf_media_player_sonos_button_color)
                  return templates;
                ]]]
              entity: "[[[ return entity.entity_id ]]]"
              tap_action:
                action: "call-service"
                service: "media_player.volume_up"
                service_data:
                  entity_id: "[[[ return entity.entity_id ]]]"
              icon: "[[[ return variables._markf_default_media_volume_up_icon ]]]"
