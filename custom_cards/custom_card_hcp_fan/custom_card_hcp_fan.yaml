---
### Card for Variable Speed Fan - HCP UI standard ###
card_hcp_fan:
  template:
    - "ulm_translation_engine"
    - "ulm_actions_card"
    - "hcp_global_defaults"
  variables:
    card_hcp_fan_name: "[[[ return entity.attributes.friendly_name; ]]]"
    card_hcp_fan_enable_collapse: true
    card_hcp_fan_enable_slider: true
    card_hcp_fan_power_entity: null
    card_hcp_fan_power_entity_icon: "[[[ return variables._hcp_default_power_entity_icon; ]]]"
    card_hcp_fan_slider_allow_tapping: false
    card_hcp_fan_slider_vertical: false
    card_hcp_fan_slider_flipped: false
    card_hcp_fan_text_color: "color_hcp_card_text_default"
    card_hcp_fan_switch_color: "color_hcp_switch_default"
    card_hcp_fan_preset_switch_color: "color_hcp_switch_option"
    card_hcp_fan_padding: "var(--hcp_minimalist_default_padding)"
    card_hcp_fan_row_gap: "var(--hcp_minimalist_default_row_gap)"
    card_hcp_fan_show_indicator: "[[[ return variables._hcp_default_show_icon_indicator; ]]]"
    ulm_icon_hold_action: "popup"
    ulm_name_hold_action: "popup"
    ulm_card_hold_action: "popup"
    ulm_name_tap_action: "popup"
    ulm_card_tap_action: "popup"
  show_icon: false
  show_name: false
  show_label: false
  styles:
    grid:
      - grid-template-areas: >
          [[[
            var areas = [];
            areas.push("item1 item1");
            if (variables.card_hcp_fan_enable_slider && (variables.ulm_active_state || !variables.card_hcp_fan_enable_collapse)) {
                areas.push("slider slider");
            }
            return "\"" + areas.join("\" \"") + "\"";
          ]]]
      - grid-template-columns: "1fr"
      - grid-template-rows: >
          [[[
            var rows = [];
            rows.push("min-content");
            if (variables.ulm_active_state && variables.card_hcp_fan_enable_slider) {
                rows.push("min-content");
            }
            return rows.join(" ");
          ]]]
      - row-gap: "[[[ return variables.card_hcp_fan_row_gap ]]]"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--box-shadow)"
      - padding: "[[[ return variables.card_hcp_fan_padding ]]]"
      - border-style: none
      - background-color: transparent
    custom_fields:
      slider:
        - display: >
            [[[
                  if (variables.card_hcp_fan_enable_slider && (variables.ulm_active_state || !variables.card_hcp_fan_enable_collapse)) {
                      return "block";
                  } else {
                      return "none";
                  }
            ]]]
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "hcp_icon_power"
          - "ulm_actions_name"
        variables:
          ulm_icon_tap_action: "[[[ return variables.ulm_icon_tap_action ]]]"
          ulm_icon_hold_action: "[[[ return variables.ulm_icon_hold_action ]]]"
          ulm_name_tap_action: "[[[ return variables.ulm_name_tap_action ]]]"
          ulm_name_hold_action: "[[[ return variables.ulm_name_hold_action ]]]"
          ulm_input_select_option: "[[[ return variables.ulm_input_select_option ]]]"
          ulm_input_select: "[[[ return variables.ulm_input_select ]]]"
          ulm_custom_popup:
            template: popup_hcp_fan
            popup_variables:
              popup_hcp_fan_history_entity: "[[[ return entity.entity_id ]]]"
          hcp_icon_power_power_entity: "[[[ return variables.card_hcp_fan_power_entity ]]]"
          hcp_icon_power_power_entity_icon: "[[[ return variables._hcp_default_power_entity_icon ]]]"
          hcp_icon_power_icon_color: "[[[ return variables.card_hcp_fan_switch_color ]]]"
          hcp_icon_power_text_color: "[[[ return variables.card_hcp_fan_text_color ]]]"
          hcp_icon_power_show_indicator: "[[[ return variables.card_hcp_fan_show_indicator ]]]"
          hcp_icon_power_name: "[[[ return variables.card_hcp_fan_name ]]]"
    slider:
      card:
        type: "custom:my-slider-v2"
        entity: "[[[ return entity.entity_id ]]]"
        allowTapping: "[[[ return variables.card_hcp_fan_slider_allow_tapping ]]]"
        vertical: "[[[ return variables.card_hcp_fan_slider_vertical ]]]"
        flipped: "[[[ return variables.card_hcp_fan_slider_flipped ]]]"
        styles:
          card:
            - height: "var(--hcp_minimalist_slider_height_horizontal)"
          container:
            - border-width: "var(--hcp_minimalist_slider_border_width)"
            - border-style: "var(--hcp_minimalist_slider_border_style)"
            - border-color: "[[[ return 'rgba(var(--hcp_minimalist_slider_border_colour),var(--hcp_minimalist_slider_border_opacity))'; ]]]"
            - border-radius: var(--hcp_minimalist_slider_border_radius)
            - box-shadow: "var(--hcp_minimalist_slider_box_shadow)"
          progress:
            - background: "[[[ return 'rgba(var(--hcp_minimalist_slider_main_color),var(--hcp_minimalist_slider_main_opacity))'; ]]]"
          track:
            - background: "[[[ return 'rgba(var(--hcp_minimalist_slider_secondary_color),var(--hcp_minimalist_slider_secondary_opacity))'; ]]]"
          thumb:
            - width: "var(--hcp_minimalist_slider_thumb_width_horizontal)"
            - background: "[[[ return 'rgba(var(--hcp_minimalist_slider_thumb_color),var(--hcp_minimalist_slider_thumb_opacity))'; ]]]"
            - border-radius: "var(--hcp_minimalist_slider_thumb_border_radius_horizontal)"
