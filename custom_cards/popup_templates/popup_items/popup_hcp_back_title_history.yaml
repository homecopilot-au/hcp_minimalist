---
popup_hcp_back_title_history:
  show_icon: false
  show_label: false
  show_name: false
  template:
    - "color_hcp_card_popup_default"
  variables:
    popup_hcp_back_title_history_hide_back: false
    popup_hcp_back_title_history_hide_title: "Title"
    popup_hcp_back_title_history_hide_history: false
    popup_hcp_back_title_history_hide_history_entity: "none"
  tap_action:
    action: "none"
  styles:
    grid:
      - grid-template-areas: "'back header history'"
      - grid-template-rows: "min-content"
      - grid-template-columns: "1fr 2.5fr 1fr"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_hcp_back_title_history_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "center"
      history:
        - display: >
            [[[
                  if (variables.popup_hcp_back_title_history_hide_history ) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - justify-self: "right"

  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_back"

    header:
      card:
        type: "custom:button-card"
        name: "[[[ return variables.popup_hcp_back_title_history_hide_title; ]]]"
        template: "popup_hcp_title"

    history:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_history"
        variables:
          popup_hcp_history_entity: >
            [[[ 
              if (!variables.popup_hcp_back_title_history_hide_history) {
                return variables.popup_hcp_back_title_history_hide_history_entity; 
              }
            ]]]

