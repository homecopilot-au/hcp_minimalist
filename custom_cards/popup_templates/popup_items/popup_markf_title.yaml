---
popup_markf_title:
  show_icon: false
  show_label: false
  show_name: true
  template:
    - "color_markf_card_popup_default"
  styles:
    card:
      - box-shadow: "none"
      - border-radius: "0px"
      - padding: "var(--markf_minimalist_default_padding)"
    name:
      - font-weight: "var(--markf_minimalist_popup_title_name_font_weight)"
      - font-size: "var(--markf_minimalist_popup_title_name_font_size)"
    label:
      - text-transform: "capitalize"
      - font-weight: "var(--markf_minimalist_popup_title_label_font_weight)"
      - font-size: "var(--markf_minimalist_popup_title_label_font_size)"
  tap_action:
    action: "none"
