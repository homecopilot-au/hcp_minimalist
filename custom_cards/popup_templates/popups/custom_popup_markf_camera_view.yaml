---
popup_markf_camera_view:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
    - "color_markf_card_popup_default"
  variables:
    popup_markf_camera_view_hide_back: false
    popup_markf_camera_view_history_entity: "[[[ return entity.entity_id ]]]"
    popup_markf_camera_view_view: "live"
    _popup_markf_camera_view_area_name: >
      [[[ 
        const entityObj = hass.entities?.[entity.entity_id];
        const deviceId = entityObj?.device_id;
        const areaId = entityObj?.area_id || hass.devices?.[deviceId]?.area_id;
        return hass.areas?.[areaId]?.name;
      ]]]
    popup_markf_camera_view_use_area_name: true
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: "'back header history' 'content1 content1 content1'"
      - grid-template-rows: "min-content min-content"
      - grid-template-columns: "1fr 2.5fr 1fr"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_markf_camera_view_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "center"
      history:
        - justify-self: "right"
      content1:
        - jusify-content: "center"
        - align-items: "center"
        - margin-left: "0px"

  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_markf_button_back"

    history:
      card:
        type: "custom:button-card"
        template: "popup_markf_button_history"
        variables:
          popup_markf_history_entity: "[[[ return variables.popup_markf_camera_view_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        name: >
          [[[ 
            if (variables.popup_markf_camera_view_use_area_name) {
              return variables._popup_markf_camera_view_area_name + ' ' + entity.attributes.friendly_name;
            } else { 
              return entity.attributes?.friendly_name;
            }
          ]]]
        template: "popup_markf_title"

    content1:
      card:
        type: "picture-entity"
        camera_image: "[[[ return entity.entity_id ]]]"
        camera_view: "[[[ return variables.popup_markf_camera_view_view ]]]"
        entity: "[[[ return entity.entity_id ]]]"
        show_name: false
        show_state: false

