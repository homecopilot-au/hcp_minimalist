---
popup_hcp_updates:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
    - "color_hcp_card_popup_default"
  variables:
    popup_hcp_update_hide_back: false
  styles:
    grid:
      - grid-template-areas: '"back top_right" "header header" "content1 content1"'
      - grid-template-columns: "1fr 3fr"
      - grid-template-rows: "min-content min-content"
      - row-gap: "var(--hcp_minimalist_default_row_gap)"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_hcp_update_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "start"
      history:
        - justify-self: "right"
      content1:
        - align-self: "start"
        - margin-left: "0px"
  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_back"
    top_right:
      card:
        type: "custom:button-card"
        color_type: blank-card

    header:
      card:
        type: "custom:button-card"
        template: "popup_hcp_title"
        name: "Available Updates"

    content1:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          exclude:
            - attributes:
                supported_features: 0
          include:
            - domain: update
              state: "on"
              options:
                type: custom:button-card
                template:
                  - "card_hcp_update"
                variables:
                  card_hcp_update_enable_controls: true
                  card_hcp_update_enable_collapse: true
                  card_hcp_update_horizontal: false
                  card_hcp_update_narrow_buttons: true
        sort:
          method: name
