---
popup_markf_cover:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
    - "color_markf_card_popup_default"
  variables:
    popup_markf_cover_hide_back: false
    popup_markf_cover_history_entity: "[[[ return entity.entity_id ]]]"
    popup_markf_cover_slider_allow_tapping: false
    popup_markf_cover_slider_vertical: true
    popup_markf_cover_slider_flipped: true
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: "'back header history' 'content1 content1 content1'"
      - grid-template-rows: "min-content min-content"
      - grid-template-columns: "1fr 2.5fr 1fr"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_markf_cover_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "center"
      history:
        - justify-self: "right"
      content1:
        - jusify-content: "center"
        - align-items: "center"
        - margin-left: "0px"

  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_markf_button_back"

    history:
      card:
        type: "custom:button-card"
        template: "popup_markf_button_history"
        variables:
          popup_markf_history_entity: "[[[ return variables.popup_markf_cover_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        name: "[[[ return entity.attributes.friendly_name ]]]"
        template: "popup_markf_title"

    content1:
      card:
        type: "custom:my-slider-v2"
        entity: "[[[ return entity.entity_id ]]]"
        allowTapping: "[[[ return variables.popup_markf_cover_slider_allow_tapping ]]]"
        vertical: "[[[ return variables.popup_markf_cover_slider_vertical ]]]"
        flipped: "[[[ return variables.popup_markf_cover_slider_flipped ]]]"
        styles:
          card:
            - height: "var(--markf_minimalist_slider_height_vertical)"
            - width: "var(--markf_minimalist_slider_width_vertical)"
          container:
            - border-width: "var(--markf_minimalist_slider_border_width)"
            - border-style: "var(--markf_minimalist_slider_border_style)"
            - border-color: "[[[ return 'rgba(var(--markf_minimalist_slider_border_colour),var(--markf_minimalist_slider_border_opacity))'; ]]]"
            - border-radius: var(--markf_minimalist_slider_border_radius)
            - box-shadow: "var(--markf_minimalist_slider_box_shadow)"
          progress:
            - background: "[[[ return 'rgba(var(--markf_minimalist_slider_main_color),var(--markf_minimalist_slider_main_opacity))'; ]]]"
          track:
            - background: "[[[ return 'rgba(var(--markf_minimalist_slider_secondary_color),var(--markf_minimalist_slider_secondary_opacity))'; ]]]"
          thumb:
            - height: "var(--markf_minimalist_slider_thumb_width_vertical)"
            - background: "[[[ return 'rgba(var(--markf_minimalist_slider_thumb_color),var(--markf_minimalist_slider_thumb_opacity))'; ]]]"
            - border-radius: "var(--markf_minimalist_slider_thumb_border_radius_vertical)"
        card_mod:
          style:
            .: |
              :host {
                display: flex;
                justify-content: center;
                align-items: center;
                background: none;
              }
