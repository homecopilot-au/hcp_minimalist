---
popup_markf_fan:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
    - "color_markf_card_popup_default"
  variables:
    popup_markf_fan_hide_back: false
    popup_markf_fan_history_entity: "[[[ return entity.entity_id ]]]"
    popup_markf_fan_slider_allow_tapping: false
    popup_markf_fan_slider_vertical: true
    popup_markf_fan_slider_flipped: false
    popup_markf_fan_direction: "[[[ return states[entity.entity_id].attributes?.direction ]]]"
    popup_markf_fan_direction_forward: "[[[ return hass.localize('component.fan.entity_component._.state.attributes.direction.state.forward') ]]]"
    popup_markf_fan_direction_reverse: "[[[ return hass.localize('component.fan.entity_component._.state.attributes.direction.state.reverse') ]]]"
    popup_markf_fan_direction_opposite: >
      [[[ 
        if (variables.popup_markf_fan_direction === variables.popup_markf_fan_direction_forward) { 
          return variables.variables.popup_markf_fan_direction_reverse.toLowerCase() ;
        } else {
          return variables.popup_markf_fan_direction_forward.toLowerCase();
        }
      ]]]
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: "'back header history' 'content1 content1 content1'"
      - grid-template-columns: "1fr 3fr 1fr"
      - grid-template-rows: "min-content min-content"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_markf_fan_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "start"
      history:
        - justify-self: "right"
      buttons:
        - align-self: "start"
        - margin-left: "0px"
  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template:
          - "popup_markf_button_back"
          - "color_markf_card_popup_default"
    history:
      card:
        type: "custom:button-card"
        template:
          - "popup_markf_button_history"
          - "color_markf_card_popup_default"
        variables:
          popup_markf_history_entity: "[[[ return variables.popup_markf_fan_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        template:
          - "popup_markf_title"
          - "color_markf_card_popup_default"
        name: "[[[ return entity.attributes.friendly_name ]]]"
        show_label: true
        label: "[[[ return entity.state ]]]"

    content1:
      card:
        type: "custom:button-card"
        template:
          - "markf_list_3x2_items"
          - "color_markf_card_popup_default"
        custom_fields:
          item2:
            card:
              type: "custom:my-slider-v2"
              entity: "[[[ return entity.entity_id ]]]"
              allowTapping: "[[[ return variables.popup_markf_fan_slider_allow_tapping ]]]"
              vertical: "[[[ return variables.popup_markf_fan_slider_vertical ]]]"
              flipped: "[[[ return variables.popup_markf_fan_slider_flipped ]]]"
              styles:
                card:
                  - height: "var(--markf_minimalist_slider_height_vertical)"
                  - width: "var(--markf_minimalist_slider_width_vertical)"
                container:
                  - border-width: "var(--markf_minimalist_slider_border_width)"
                  - border-style: "var(--markf_minimalist_slider_border_style)"
                  - border-color: "[[[ return 'rgba(var(--markf_minimalist_slider_border_colour),var(--markf_minimalist_slider_border_opacity))'; ]]]"
                  - border-radius: var(--markf_minimalist_slider_border_radius)
                  - box-shadow: "var(--markf_minimalist_slider_box_shadow)"
                progress:
                  - background: "[[[ return 'rgba(var(--markf_minimalist_slider_main_color),var(--markf_minimalist_slider_main_opacity))'; ]]]"
                track:
                  - background: "[[[ return 'rgba(var(--markf_minimalist_slider_secondary_color),var(--markf_minimalist_slider_secondary_opacity))'; ]]]"
                thumb:
                  - height: "var(--markf_minimalist_slider_thumb_width_vertical)"
                  - background: "[[[ return 'rgba(var(--markf_minimalist_slider_thumb_color),var(--markf_minimalist_slider_thumb_opacity))'; ]]]"
                  - border-radius: "var(--markf_minimalist_slider_thumb_border_radius_vertical)"
              card_mod:
                style:
                  .: |
                    :host {
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      background: none;
                    }
          item5:
            card:
              type: "custom:button-card"
              template:
                - "markf_widget_button_label"
                - "color_markf_switch_default"
              entity: "[[[ return entity.entity_id ]]]"
              icon: mdi:sync
              variables:
                markf_widget_button_label: "[[[ return variables.popup_markf_fan_direction ]]]"
              tap_action:
                action: call-service
                service: script.toggle_fan_direction
                service_data:
                  entity_id: "[[[ return entity.entity_id ]]]"