---
popup_hcp_history:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
    - "color_hcp_card_popup_default"
  variables:
    _popup_hcp_history_area: >
      [[[ 
        const entityObj = hass.entities?.[entity.entity_id];
        const deviceId = entityObj?.device_id;
        const areaId = entityObj?.area_id || hass.devices?.[deviceId]?.area_id;
        return hass.areas?.[areaId]?.name;
      ]]]      
  styles:
    grid:
      - grid-template-areas: '"back top_right" "header header" "divider1 divider1" "content1 content1" "divider2 divider2" "content2 content2"'
      - grid-template-columns: "1fr 3fr"
      - grid-template-rows: "min-content min-content min-content min-content min-content min-content"
      - row-gap: "5px"
    custom_fields:
      back:
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "start"
      content1:
        - align-self: "start"
        - margin-left: "0px"
  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_back"
    top_right:
      card:
        type: "custom:button-card"
        color_type: blank-card

    header:
      card:
        type: "custom:button-card"
        template: "popup_hcp_title"
        show_label: true
        name: >-
          [[[ 
            if (variables._popup_hcp_history_area) {
              return variables._popup_hcp_history_area;
            } else { 
              return entity.attributes?.friendly_name;
            }
          ]]]
        label: "[[[ return entity.entity_id ]]]"

    divider1:
      card:
        type: "custom:button-card"
        template: "popup_hcp_subtitle"
        name: History

    content1:
      card:
        type: custom:apexcharts-card
        graph_span: 12h
        series:
          - entity: "[[[ return entity.entity_id ]]]"
            type: "line"
            curve: "stepline"
            color: "var(--hcp_minimalist_popup_history_graph_line_color)"
            opacity: 1
            transform: 'if (["on","off"].includes(x)) { return x === "on" ? 1 : 0;} else {return x;}'
        yaxis:
          - min: "auto"
            apex_config:
              stepSize: 1
        apex_config:
          chart:
            height: 220
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--hcp_minimalist_popup_history_box_shadow) !important;
              background-color: rgba(var(--hcp_minimalist_popup_history_graph_background_color), var(--hcp_minimalist_popup_history_graph_background_opacity)) !important;
            }

    divider2:
      card:
        type: "custom:button-card"
        template: "popup_hcp_subtitle"
        name: Log Book

    content2:
      card:
        type: "logbook"
        entities:
          - "[[[ return entity.entity_id ]]]"
        card_mod:
          style: |
            ha-card {
              box-shadow: var(--hcp_minimalist_popup_history_box_shadow) !important;
              background-color: rgba(var(--hcp_minimalist_popup_history_logbook_background_color), var(--hcp_minimalist_popup_history_logbook_background_opacity)) !important;
              height: 242px !important;
            }
            ha-logbook {
              height: 220px !important;
            }
