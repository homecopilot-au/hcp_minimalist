popup_hcp_nest_protect:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
    - "color_hcp_card_popup_default"
  variables:
    popup_hcp_nest_protect_device_name: null
    popup_hcp_nest_protect_hide_back: false
    popup_hcp_nest_protect_configuration_color: "color_hcp_switch_popup"
    popup_hcp_nest_protect_brightness_color: "color_hcp_switch_option"
    popup_hcp_nest_protect_sensor_alert_color: "color_hcp_icon_info_active_alert_inactive_ok"
    popup_hcp_nest_protect_sensor_color: "color_hcp_icon_info_active_ok_inactive_alert"
    popup_hcp_nest_protect_icon_color: "color_hcp_icon_default"
    popup_hcp_nest_protect_brightness_entity: null
    popup_hcp_nest_protect_brightness_option_1: "[[[ return states[variables.popup_hcp_nest_protect_brightness_entity].attributes?.options[0]; ]]]"
    popup_hcp_nest_protect_brightness_option_2: "[[[ return states[variables.popup_hcp_nest_protect_brightness_entity].attributes?.options[1]; ]]]"
    popup_hcp_nest_protect_brightness_option_3: "[[[ return states[variables.popup_hcp_nest_protect_brightness_entity].attributes?.options[2]; ]]]"
    popup_hcp_nest_protect_history_entity: "[[[ return entity.entity_id ]]]"
    popup_hcp_nest_protect_brightness_label: "[[[ return variables._hcp_default_popup_brightness_label; ]]]"
    popup_hcp_nest_protect_configuration_label: "[[[ return variables._hcp_default_popup_configuration_label; ]]]"
    popup_hcp_nest_protect_diagnostic_label: "[[[ return variables._hcp_default_popup_diagnostic_label; ]]]"
    popup_hcp_nest_protect_replacement_label: "[[[ return variables._hcp_default_popup_replacement_label; ]]]"
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: '"back header history" "divider1 divider1 divider1" "content1 content1 content1" "divider2 divider2 divider2" "content2 content2 content2" "divider3 divider3 divider3" "content3 content3 content3" "divider4 divider4 divider4" "replace replace replace"'
      - grid-template-columns: "1fr 3fr 1fr"
      - grid-template-rows: "min-content min-content min-content min-content min-content min-content min-content min-content min-content"
    card:
      - box-shadow: "none"
      - padding: "var(--hcp_minimalist_default_padding)"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_hcp_nest_protect_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "start"
      history:
        - justify-self: "right"
      content1:
        - align-self: "start"
        - margin-left: "0px"
  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_back"

    header:
      card:
        type: "custom:button-card"
        template: "popup_hcp_title"
        name: "[[[ return variables.popup_hcp_nest_protect_device_name; ]]]"

    history:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_history"
        variables:
          popup_hcp_history_entity: "[[[ return variables.popup_hcp_nest_protect_history_entity ]]]"

    divider1:
      card:
        type: "custom:button-card"
        template: "popup_hcp_subtitle"
        name: "[[[ return variables.popup_hcp_nest_protect_configuration_label; ]]]"

    content1:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: 4
          square: false
        card_param: cards
        filter:
          exclude:
            - hidden_by: "user"
          include:
            - device: "[[[ return variables.popup_hcp_nest_protect_device_name; ]]]"
              domain: switch
              options:
                type: custom:button-card
                entity_id: this.entity_id
                template: >
                  [[[
                    var templates = ["hcp_widget_button_label"]
                    templates.push(variables.popup_hcp_nest_protect_configuration_color)
                    return templates;
                  ]]]
                styles:
                  card:
                    - padding: "var(--hcp_minimalist_default_padding)"
                hold_action:
                  action: "fire-dom-event"
                  browser_mod:
                    service: "browser_mod.popup"
                    data:
                      hide_header: true
                      style: |
                      --popup-background-color: var(--hcp_minimalist_popup_background_color);
                      --popup-border-radius: var(--hcp_minimalist_popup_border_radius);
                      --popup-padding-x: var(--hcp_minimalist_popup_padding_x);
                      --popup-padding-y: var(--hcp_minimalist_popup_padding_y);
                      --popup-max-width: var(--hcp_minimalist_popup_max_width);
                      --popup-min-width: var(--hcp_minimalist_popup_min_width);;
                      size: >
                        [[[
                          const mediaQuery = window.matchMedia('(max-width: 1200px)')
                          if (mediaQuery.matches) {
                            return 'fullscreen'
                          }
                        ]]]
                      content:
                        type: "custom:button-card"
                        template: "popup_hcp_history"
                        entity: this.entity_id

        sort:
          method: name

    divider2:
