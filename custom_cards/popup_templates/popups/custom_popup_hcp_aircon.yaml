---
popup_hcp_aircon:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
    - "color_hcp_card_popup_default"
  variables:
    popup_hcp_aircon_hide_back: false
    popup_hcp_aircon_history_entity: "[[[ return entity.entity_id ]]]"
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: "'back header history' 'content1 content1 content1' 'content2 content2 content2' 'content3 content3 content3'"
      - grid-template-rows: "min-content min-content min-content min-content"
      - grid-template-columns: "1fr 2.5fr 1fr"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_hcp_aircon_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "center"
      history:
        - justify-self: "right"
      content1:
        - jusify-content: "center"
        - align-items: "center"
        - margin-left: "0px"

  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_back"

    history:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_history"
        variables:
          popup_hcp_history_entity: "[[[ return variables.popup_hcp_aircon_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        name: "[[[ return entity.attributes.friendly_name ]]]"
        template: "popup_hcp_title"

    content1:
      card:
        type: "tile"
        entity: climate.daikin_aircon
        hide_state: true
        name: Mode
        features:
          - type: climate-hvac-modes
            style: dropdown
            hvac_modes:
              - "off"
              - cool
              - heat
              - heat_cool
              - dry
              - fan_only
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
            }
            ha-tile-icon {
              display: none;
            }

    content2:
      card:
        type: "tile"
        entity: climate.daikin_aircon
        hide_state: true
        name: Fan Speed
        features:
          - type: climate-fan-modes
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
            }
            ha-tile-icon {
              display: none;
            }

    content3:
      card:
        type: "tile"
        entity: climate.daikin_aircon
        hide_state: true
        name: Presets
        features:
          - type: climate-preset-modes
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
            }
            ha-tile-icon {
              display: none;
            }
