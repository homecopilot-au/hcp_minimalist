---
popup_markf_dishwasher:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
    - "color_markf_card_popup_default"
  variables:
    popup_markf_dishwasher_name: ""
    popup_markf_dishwasher_device_name: ""
    popup_markf_dishwasher_hide_back: false
    popup_markf_dishwasher_history_entity: ""
    popup_markf_dishwasher_sensor_color: "color_markf_icon_default"
    popup_markf_dishwasher_binary_sensor_color: "color_markf_icon_info_active_ok_inactive_off"

  styles:
    grid:
      - grid-template-areas: '"back header history" "divider1 divider1 divider1" "content1 content1 content1" "divider2 divider2 divider2" "content2 content2 content2"'
      - grid-template-columns: "1fr 3fr 1fr"
      - grid-template-rows: "min-content min-content"
      - row-gap: "5px"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_markf_dishwasher_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "start"
      history:
        - justify-self: "right"
      content1:
        - align-self: "start"
        - margin-left: "0px"

  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_markf_button_back"
    history:
      card:
        type: "custom:button-card"
        template: "popup_markf_button_history"
        variables:
          popup_markf_history_entity: "[[[ return variables.popup_markf_dishwasher_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        template: "popup_markf_title"
        name: "[[[ return variables.popup_markf_dishwasher_name ]]]"
        show_label: false

    divider1:
      card:
        type: "custom:button-card"
        template: "popup_markf_subtitle"
        name: Sensors

    content1:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: 3
          square: false
        card_param: cards
        filter:
          include:
            - device: "[[[ return variables.popup_markf_dishwasher_device_name; ]]]"
              domain: sensor
              options:
                type: custom:button-card
                template: >
                  [[[
                    var templates = ["markf_icon_info"]
                    return templates;
                  ]]]
                styles:
                  card:
                    - padding: "var(--markf_minimalist_default_padding)"
                variables:
                  markf_icon_info_label_swap: true
                  markf_icon_info_icon_color: "[[[ return variables.popup_markf_dishwasher_sensor_color ]]]"
                hold_action:
                  action: "fire-dom-event"
                  browser_mod:
                    service: "browser_mod.popup"
                    data:
                      hide_header: true
                      style: |
                        --popup-background-color: var(--markf_minimalist_popup_background_color);
                        --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                        --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                        --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                        --popup-max-width: var(--markf_minimalist_popup_max_width);
                        --popup-min-width: var(--markf_minimalist_popup_min_width);;
                      size: >
                        [[[
                          const mediaQuery = window.matchMedia('(max-width: 1200px)')
                          if (mediaQuery.matches) {
                            return 'fullscreen'
                          }
                        ]]]
                      content:
                        type: "custom:button-card"
                        template: "popup_markf_history"
                        entity: this.entity_id
        sort:
          method: name

    divider2:
      card:
        type: "custom:button-card"
        template: "popup_markf_subtitle"
        name: Options

    content2:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: 3
          square: false
        card_param: cards
        filter:
          include:
            - device: "[[[ return variables.popup_markf_dishwasher_device_name; ]]]"
              domain: binary_sensor
              options:
                type: custom:button-card
                template: >
                  [[[
                    var templates = ["markf_widget_button_label"]
                    templates.push(variables.popup_markf_dishwasher_binary_sensor_color)
                    return templates;
                  ]]]
                styles:
                  card:
                    - padding: "var(--markf_minimalist_default_padding)"
                hold_action:
                  action: "fire-dom-event"
                  browser_mod:
                    service: "browser_mod.popup"
                    data:
                      hide_header: true
                      style: |
                        --popup-background-color: var(--markf_minimalist_popup_background_color);
                        --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                        --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                        --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                        --popup-max-width: var(--markf_minimalist_popup_max_width);
                        --popup-min-width: var(--markf_minimalist_popup_min_width);;
                      size: >
                        [[[
                          const mediaQuery = window.matchMedia('(max-width: 1200px)')
                          if (mediaQuery.matches) {
                            return 'fullscreen'
                          }
                        ]]]
                      content:
                        type: "custom:button-card"
                        template: "popup_markf_history"
                        entity: this.entity_id
        sort:
          method: name

