---
popup_markf_3_speedfan:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
    - "color_markf_popup_default"
  variables:
    popup_markf_3speedfan_hide_back: false
    popup_markf_3speedfan_history_entity: "[[[ return entity.entity_id ]]]"
    popup_markf_3speedfan_button_color: "color_markf_fan_speed_1_button"
    popup_markf_3speedfan_button_1_color: "color_markf_fan_speed_1_button"
    popup_markf_3speedfan_button_2_color: "color_markf_fan_speed_2_button"
    popup_markf_3speedfan_button_3_color: "color_markf_fan_speed_3_button"
  styles:
    grid:
      - grid-template-areas: '"back header history" "buttons buttons buttons" "divider1 divider1 divider1"'
      - grid-template-columns: "1fr 3fr 1fr"
      - grid-template-rows: "min-content min-content"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_markf_3speedfan_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "start"
      history:
        - justify-self: "right"
      buttons:
        - align-self: "start"
        - margin-left: "0px"
  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: 
          - "popup_markf_button_back"
          - "color_markf_popup_default"
    history:
      card:
        type: "custom:button-card"
        template: 
          - "popup_markf_button_history"
          - "color_markf_popup_default"
        variables:
          popup_markf_history_entity: "[[[ return variables.popup_markf_3speedfan_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        template: 
          - "popup_markf_title"
          - "color_markf_popup_default"
        name: "[[[ return entity.attributes.friendly_name ]]]"
        show_label: true
        label: "[[[ return entity.state ]]]"

    buttons:
      card:
        type: "custom:button-card"
        template:
          - "markf_list_3x4_items"
          - "color_markf_popup_default"
        custom_fields:
          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_button_label"]
                  templates.push(variables.popup_markf_3speedfan_button_color)
                  return templates;
                ]]]
              icon: "[[[ return entity.attributes.icon; ]]]"
              label: "[[[ return entity.state; ]]]"
              tap_action:
                action: "toggle"
          item5:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_button_label"]
                  templates.push(variables.popup_markf_3speedfan_button_1_color)
                  return templates;
                ]]]
              icon: "[[[ return variables.card_markf_3speedfan_speed_1_icon ]]]"
              label: "[[[ return variables._markf_default_3speedfan_speed_1_preset ]]]"
              tap_action:
                action: "call-service"
                service: "fan.set_preset_mode"
                service_data:
                  entity_id: "[[[ return entity.entity_id ]]]"
                  preset_mode: "[[[ return variables._markf_default_3speedfan_speed_1_preset ]]]"
          item8:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_button_label"]
                  templates.push(variables.popup_markf_3speedfan_button_2_color)
                  return templates;
                ]]]
              icon: "[[[ return variables.card_markf_3speedfan_speed_2_icon ]]]"
              label: "[[[ return variables._markf_default_3speedfan_speed_2_preset ]]]"
              tap_action:
                action: "call-service"
                service: "fan.set_preset_mode"
                service_data:
                  entity_id: "[[[ return entity.entity_id ]]]"
                  preset_mode: "[[[ return variables._markf_default_3speedfan_speed_2_preset ]]]"
          item11:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_button_label"]
                  templates.push(variables.popup_markf_3speedfan_button_3_color)
                  return templates;
                ]]]
              icon: "[[[ return variables.card_markf_3speedfan_speed_3_icon ]]]"
              label: "[[[ return variables._markf_default_3speedfan_speed_3_preset ]]]"
              tap_action:
                action: "call-service"
                service: "fan.set_preset_mode"
                service_data:
                  entity_id: "[[[ return entity.entity_id ]]]"
                  preset_mode: "[[[ return variables._markf_default_3speedfan_speed_3_preset ]]]"
