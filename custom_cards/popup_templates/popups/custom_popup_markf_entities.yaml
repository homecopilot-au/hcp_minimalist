---
popup_markf_entities:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
    - "color_markf_card_popup_default"
  variables:
    popup_markf_entities_sensor_color: "color_markf_icon_info_active_alert_inactive_ok"
    popup_markf_entities_power_consumption_icon: "[[[ return variables._markf_default_power_entity_icon; ]]]"
    popup_markf_entities_consumption: ""
    popup_markf_entities_consumption_icon: "mdi:flash"
    popup_markf_entities_group: ""
    popup_markf_entities_type: ""
    popup_markf_entities_show_area: false
    popup_markf_entities_show_state: true
    popup_markf_entities_title: "Power"
    popup_markf_entities_hide_back: false
    popup_markf_entities_hide_consumption: false
    popup_markf_entities_area: "*"
    popup_markf_entities_columns: 3
    popup_markf_entities_subtitle_1: ""
    popup_markf_entities_contents_1_1: ""
    popup_markf_entities_contents_1_1_color_template: "color_markf_button_power"
    popup_markf_entities_contents_1_2: ""
    popup_markf_entities_contents_1_2_color_template: "color_markf_button_power"
    popup_markf_entities_subtitle_2: ""
    popup_markf_entities_contents_2_1: ""
    popup_markf_entities_contents_2_1_color_template: "color_markf_button_power"
    popup_markf_entities_contents_2_2: ""
    popup_markf_entities_contents_2_2_color_template: "color_markf_button_power"
    popup_markf_entities_subtitle_3: ""
    popup_markf_entities_contents_3_1: ""
    popup_markf_entities_contents_3_1_color_template: "color_markf_button_power"
    popup_markf_entities_contents_3_2: ""
    popup_markf_entities_contents_3_2_color_template: "color_markf_button_power"
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: '"back header consumption" "divider1 divider1 divider1" "content1 content1 content1" "divider2 divider2 divider2" "content2 content2 content2" "divider3 divider3 divider3" "content3 content3 content3"'
      - grid-template-columns: "1fr 2.5fr 1.5fr"
      - grid-template-rows: "min-content min-content min-content min-content min-content"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    card:
      - background: "var(--markf_minimalist_popup_background_color)"
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--markf_minimalist_popup_box_shadow)"
      - padding: "var(--markf_minimalist_default_padding)"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_markf_entities_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
      header:
        - align-self: "start"
      consumption:
        - display: >
            [[[
                  if (variables.popup_markf_entities_hide_consumption) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - justify-self: "right"
      divider1:
        - display: >
            [[[
              if (variables.popup_markf_entities_subtitle_1 === '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      content1:
        - align-self: "start"
        - display: >
            [[[
              if (variables.popup_markf_entities_contents_1_1 === '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      divider2:
        - display: >
            [[[
              if (variables.popup_markf_entities_subtitle_2 === '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      content2:
        - align-self: "start"
        - display: >
            [[[
              if (variables.popup_markf_entities_contents_2_1 === '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      divider3:
        - display: >
            [[[
              if (variables.popup_markf_entities_subtitle_3 === '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      content3:
        - align-self: "start"
        - display: >
            [[[
              if (variables.popup_markf_entities_contents_3_1 === '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]

  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_markf_button_back"

    header:
      card:
        type: "custom:button-card"
        template: "popup_markf_title"
        name: >
          [[[
            if (variables.popup_markf_entities_title != '') {
              return variables.popup_markf_entities_title 
            } else {
              return variables.popup_markf_entities_area
            }
          ]]]

    consumption:
      card:
        type: "custom:button-card"
        template: "chip_markf_icon_state"
        entity: >
          [[[ 
            if (variables.popup_markf_entities_consumption != '') {
              return variables.popup_markf_entities_consumption
            } else {
              return entity.entity_id
            }
          ]]]
        variables:
          chip_markf_icon_state_icon: "[[[ return variables.popup_markf_entities_consumption_icon; ]]]"
          chip_markf_icon_show_state: true

    divider1:
      card:
        type: "custom:button-card"
        template: "popup_markf_subtitle"
        name: "[[[ return variables.popup_markf_entities_subtitle_1; ]]]"

    content1:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: "[[[ return variables.popup_markf_entities_columns; ]]]"
          square: false
        card_param: cards
        filter:
          exclude:
            - hidden_by: "user"
          include:
            - group: "[[[ return variables.popup_markf_entities_contents_1_1; ]]]"
              area: "[[[ return variables.popup_markf_entities_area; ]]]"
              options:
                type: custom:button-card
                template: >
                  [[[
                    var templates = ["markf_widget_button_info"]
                    templates.push(variables.popup_markf_entities_contents_1_1_color_template)
                    return templates;
                  ]]]
                variables:
                  markf_widget_button_info_show_area: "[[[ return variables.popup_markf_entities_show_area ]]]"
                  markf_widget_button_info_show_state: "[[[ return variables.popup_markf_entities_show_state ]]]"
                hold_action:
                  action: "fire-dom-event"
                  browser_mod:
                    service: "browser_mod.popup"
                    data:
                      hide_header: true
                      style: |
                        --popup-background-color: var(--markf_minimalist_popup_background_color);
                        --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                        --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                        --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                        --popup-max-width: var(--markf_minimalist_popup_max_width);
                        --popup-min-width: var(--markf_minimalist_popup_min_width);;
                      size: >
                        [[[
                          const mediaQuery = window.matchMedia('(max-width: 1200px)')
                          if (mediaQuery.matches) {
                            return 'fullscreen'
                          }
                        ]]]
                      content:
                        type: "custom:button-card"
                        template: "popup_markf_history"
                        entity: "[[[ return entity.entity_id ]]]"
            - group: "[[[ return variables.popup_markf_entities_contents_1_2; ]]]"
              area: "[[[ return variables.popup_markf_entities_area; ]]]"
              options:
                type: custom:button-card
                template: >
                  [[[
                    var templates = ["markf_widget_button_info"]
                    templates.push(variables.popup_markf_entities_contents_1_2_color_template)
                    return templates;
                  ]]]
                variables:
                  markf_widget_button_info_show_area: "[[[ return variables.popup_markf_entities_show_area ]]]"
                  markf_widget_button_info_show_state: "[[[ return variables.popup_markf_entities_show_state ]]]"
                hold_action:
                  action: "fire-dom-event"
                  browser_mod:
                    service: "browser_mod.popup"
                    data:
                      hide_header: true
                      style: |
                        --popup-background-color: var(--markf_minimalist_popup_background_color);
                        --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                        --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                        --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                        --popup-max-width: var(--markf_minimalist_popup_max_width);
                        --popup-min-width: var(--markf_minimalist_popup_min_width);;
                      size: >
                        [[[
                          const mediaQuery = window.matchMedia('(max-width: 1200px)')
                          if (mediaQuery.matches) {
                            return 'fullscreen'
                          }
                        ]]]
                      content:
                        type: "custom:button-card"
                        template: "popup_markf_history"
                        entity: "[[[ return entity.entity_id ]]]"
        sort:
          method: area

    divider2:
      card:
        type: "custom:button-card"
        template: "popup_markf_subtitle"
        name: "[[[ return variables.popup_markf_entities_subtitle_2; ]]]"

