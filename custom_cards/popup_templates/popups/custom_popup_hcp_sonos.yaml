---
popup_hcp_sonos:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
    - "color_hcp_card_popup_default"
  variables:
    popup_hcp_sonos_entity_name: "[[[ return entity.attributes.friendly_name; ]]]"
    popup_hcp_sonos_device_name: ""
    popup_hcp_sonos_hide_back: false
    popup_hcp_sonos_switch_color: "color_hcp_switch_popup"
    popup_hcp_sonos_sensor_color: "color_hcp_icon_info_sonos"
    popup_hcp_sonos_history_entity: "[[[ return entity.entity_id; ]]]"
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: '"back header history" "divider1 divider1 divider1" "content1 content1 content1" "divider2 divider2 divider2" "content2 content2 content2" "divider3 divider3 divider3" "content3 content3 content3"'
      - grid-template-columns: "1fr 2.5fr 1.5fr"
      - grid-template-rows: "min-content min-content min-content min-content min-content min-content min-content"
      - row-gap: "var(--hcp_minimalist_default_row_gap)"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_hcp_sonos_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
      header:
        - align-self: "start"
      history:
        - justify-self: "right"
      content1:
        - align-self: "start"
        - margin-left: "0px"
  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template:
          - "popup_hcp_button_back"
          - "color_hcp_card_popup_default"

    history:
      card:
        type: "custom:button-card"
        template:
          - "popup_hcp_button_history"
          - "color_hcp_card_popup_default"
        variables:
          popup_hcp_history_entity: "[[[ return variables.popup_hcp_sonos_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        template:
          - "popup_hcp_title"
          - "color_hcp_card_popup_default"
        name: "[[[ return variables.popup_hcp_sonos_entity_name; ]]]"

    divider1:
      card:
        type: "custom:button-card"
        template: "popup_hcp_subtitle"
        name: Configuration

    content1:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: 3
          square: false
        card_param: cards
        filter:
          include:
            - device: "[[[ return variables.popup_hcp_sonos_device_name; ]]]"
              integration: sonos
              domain: switch
              options:
                type: custom:button-card
                template: >
                  [[[
                    var templates = ["hcp_widget_button_label"]
                    templates.push(variables.popup_hcp_sonos_switch_color)
                    return templates;
                  ]]]
                hold_action:
                  action: "fire-dom-event"
                  browser_mod:
                    service: "browser_mod.popup"
                    data:
                      hide_header: true
                      style: |
                        --popup-background-color: var(--hcp_minimalist_popup_background_color);
                        --popup-border-radius: var(--hcp_minimalist_popup_border_radius);
                        --popup-padding-x: var(--hcp_minimalist_popup_padding_x);
                        --popup-padding-y: var(--hcp_minimalist_popup_padding_y);
                        --popup-max-width: var(--hcp_minimalist_popup_max_width);
                        --popup-min-width: var(--hcp_minimalist_popup_min_width);;
                      size: >
                        [[[
                          const mediaQuery = window.matchMedia('(max-width: 1200px)')
                          if (mediaQuery.matches) {
                            return 'fullscreen'
                          }
                        ]]]
                      content:
                        type: "custom:button-card"
                        template: "popup_hcp_history"
                        entity: this.entity_id

        sort:
          method: name

    divider2:
      card:
        type: "custom:button-card"
        template: "popup_hcp_subtitle"
        name: Levels

    content2:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - device: "[[[ return variables.popup_hcp_sonos_device_name; ]]]"
              integration: sonos
              domain: number
              options:
                type: custom:button-card
                template:
                  - "popup_hcp_slider"
                variables:
                  popup_hcp_slider_main_color: "[[[ return variables._hcp_default_slider_main_color; ]]]"
                  popup_hcp_slider_secondary_color: "[[[ return variables._hcp_default_slider_secondary_color; ]]]"
        sort:
          method: name

    divider3:
      card:
        type: "custom:button-card"
        template: "popup_hcp_subtitle"
        name: Sensors

    content3:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - device: "[[[ return variables.popup_hcp_sonos_device_name; ]]]"
              integration: sonos
              domain: sensor
              options:
                type: custom:button-card
                template: >
                  [[[
                    var templates = ["hcp_icon_info"]
                    templates.push(variables.popup_hcp_sonos_sensor_color)
                    return templates;
                  ]]]
                variables:
                  hcp_icon_info_icon_color: "[[[ return variables.popup_hcp_sonos_sensor_color; ]]]"
                  hcp_icon_info_label_swap: true
        sort:
          method: name
