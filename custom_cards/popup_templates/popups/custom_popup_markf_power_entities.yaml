---
popup_markf_power_entities:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  variables:
    popup_markf_power_entities_area: "*"
    popup_markf_power_entities_light: ""
    popup_markf_power_entities_fan: ""
    popup_markf_power_entities_pwrpnt: ""
    popup_markf_power_entities_consumption: ""
    popup_markf_power_entities_title: ""
    popup_markf_power_entities_light_subtitle: "Lights"
    popup_markf_power_entities_fan_subtitle: "Fans"
    popup_markf_power_entities_pwrpnt_subtitle: "Power Points"
    popup_markf_power_entities_show_area: true
    popup_markf_power_entities_columns: 3
  styles:
    grid:
      - grid-template-areas: '"back header consumption" "divider1 divider1 divider1" "content1 content1 content1" "divider2 divider2 divider2" "content2 content2 content2" "divider3 divider3 divider3" "content3 content3 content3"'
      - grid-template-columns: "1fr 2.5fr 1.5fr"
      - grid-template-rows: "min-content min-content min-content min-content min-content"
      - row-gap: "var(--markf_minimalist_power_entities_row_gap)"
    card:
      - background: "var(--markf_minimalist_popup_background_color)"
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--markf_minimalist_popup_box_shadow)"
      - padding: "var(--markf_minimalist_power_entities_card_padding)"
    custom_fields:
      header:
        - align-self: "start"
      consumption:
        - justify-self: "right"
      divider1:
        - display: >
            [[[
              if (variables.popup_markf_power_entities_light == '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      content1:
        - align-self: "start"
        - display: >
            [[[
              if (variables.popup_markf_power_entities_light == '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      divider2:
        - display: >
            [[[
              if (variables.popup_markf_power_entities_fan == '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      content2:
        - align-self: "start"
        - display: >
            [[[
              if (variables.popup_markf_power_entities_fan == '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      divider3:
        - display: >
            [[[
              if (variables.popup_markf_power_entities_pwrpnt == '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]
      content3:
        - align-self: "start"
        - display: >
            [[[
              if (variables.popup_markf_power_entities_pwrpnt == '') {
                  return "none";
              } else {
                  return "block";
              }
            ]]]

  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_markf_button_back"

    header:
      card:
        type: "custom:button-card"
        template: "popup_markf_title"
        name: >
          [[[
            if (variables.popup_markf_power_entities_title != '') {
              return variables.popup_markf_power_entities_title 
            } else {
              return variables.popup_markf_power_entities_area
            }
          ]]]

    consumption:
      card:
        type: "custom:button-card"
        template: "chip_markf_icon_state"
        entity: >
          [[[ 
            if (variables.popup_markf_power_entities_consumption != '') {
              return variables.popup_markf_power_entities_consumption
            } else {
              return entity.entity_id
            }
          ]]]
        variables:
          chip_markf_icon_state_icon: mdi:flash
          chip_markf_icon_show_state: true

    divider1:
      card:
        type: "custom:button-card"
        template: "popup_markf_subtitle"
        name: "[[[ return variables.popup_markf_power_entities_light_subtitle ]]]"

    content1:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: "[[[ return variables.popup_markf_power_entities_columns ]]]"
          square: false
        card_param: cards
        filter:
          exclude:
            - hidden_by: "user"
          include:
            - group: "[[[ return variables.popup_markf_power_entities_light; ]]]"
              area: "[[[ return variables.popup_markf_power_entities_area; ]]]"
              options:
                type: custom:button-card
                template:
                  - "popup_markf_button_power"
                  - "color_markf_power_button"
                variables:
                  popup_markf_button_power_consumption_total: "[[[ return entity.entity_id ]]]"
                  popup_markf_button_power_show_area: "[[[ return variables.popup_markf_power_entities_show_area ]]]"
                hold_action:
                  action: "fire-dom-event"
                  browser_mod:
                    service: "browser_mod.popup"
                    data:
                      hide_header: true
                      style: |
                        --popup-background-color: var(--markf_minimalist_popup_background_color);
                        --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                        --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                        --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                        --popup-max-width: var(--markf_minimalist_popup_max_width);
                        --popup-min-width: var(--markf_minimalist_popup_min_width);;
                      size: >
                        [[[
                          const mediaQuery = window.matchMedia('(max-width: var(--markf_minimalist_popup_fullscreen_width))')
                          if (mediaQuery.matches) {
                            return 'fullscreen'
                          }
                        ]]]
                      content:
                        type: "custom:button-card"
                        template: "popup_markf_history"
                        entity: "[[[ return entity.entity_id ]]]"
        sort:
          method: area

    divider2:
      card:
        type: "custom:button-card"
        template: "popup_markf_subtitle"
        name: "[[[ return variables.popup_markf_power_entities_fan_subtitle ]]]"

    content2:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: "[[[ return variables.popup_markf_power_entities_columns ]]]"
          square: false
        card_param: cards
        filter:
          include:
            - group: "[[[ return variables.popup_markf_power_entities_fan; ]]]"
              area: "[[[ return variables.popup_markf_power_entities_area; ]]]"
              options:
                type: custom:button-card
                template:
                  - "popup_markf_button_power"
                  - "color_markf_power_button"
                variables:
                  popup_markf_button_power_consumption_total: "[[[ return entity.entity_id ]]]"
                  popup_markf_button_power_show_area: "[[[ return variables.popup_markf_power_entities_show_area ]]]"
                hold_action:
                  action: "fire-dom-event"
                  browser_mod:
                    service: "browser_mod.popup"
                    data:
                      hide_header: true
                      style: |
                        --popup-background-color: var(--markf_minimalist_popup_background_color);
                        --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                        --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                        --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                        --popup-max-width: var(--markf_minimalist_popup_max_width);
                        --popup-min-width: var(--markf_minimalist_popup_min_width);;
                      size: >
                        [[[
                          const mediaQuery = window.matchMedia('(max-width: var(--markf_minimalist_popup_fullscreen_width))')
                          if (mediaQuery.matches) {
                            return 'fullscreen'
                          }
                        ]]]
                      content:
                        type: "custom:button-card"
                        template: "popup_markf_history"
                        entity: "[[[ return entity.entity_id ]]]"
        sort:
          method: area

    divider3:
      card:
        type: "custom:button-card"
        template: "popup_markf_subtitle"
        name: "[[[ return variables.popup_markf_power_entities_pwrpnt_subtitle ]]]"

    content3:
      card:
        type: "custom:auto-entities"
        card:
          type: grid
          columns: "[[[ return variables.popup_markf_power_entities_columns ]]]"
          square: false
        card_param: cards
        filter:
          exclude:
            - hidden_by: "user"
          include:
            - group: "[[[ return variables.popup_markf_power_entities_pwrpnt; ]]]"
              area: "[[[ return variables.popup_markf_power_entities_area; ]]]"
              options:
                type: custom:button-card
                template:
                  - "popup_markf_button_power"
                  - "color_markf_power_button"
                variables:
                  popup_markf_button_power_consumption_total: "[[[ return entity.entity_id ]]]"
                  popup_markf_button_power_show_area: "[[[ return variables.popup_markf_power_entities_show_area ]]]"
                hold_action:
                  action: "fire-dom-event"
                  browser_mod:
                    service: "browser_mod.popup"
                    data:
                      hide_header: true
                      style: |
                        --popup-background-color: var(--markf_minimalist_popup_background_color);
                        --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                        --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                        --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                        --popup-max-width: var(--markf_minimalist_popup_max_width);
                        --popup-min-width: var(--markf_minimalist_popup_min_width);;
                      size: >
                        [[[
                          const mediaQuery = window.matchMedia('(max-width: var(--markf_minimalist_popup_fullscreen_width))')
                          if (mediaQuery.matches) {
                            return 'fullscreen'
                          }
                        ]]]
                      content:
                        type: "custom:button-card"
                        template: "popup_markf_history"
                        entity: this.entity_id
        sort:
          method: area
