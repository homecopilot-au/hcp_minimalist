---
popup_hcp_light:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
    - "color_hcp_card_popup_default"
  variables:
    popup_hcp_light_hide_back: false
    popup_hcp_light_history_entity: "[[[ return entity.entity_id ]]]"
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: "'back header history' 'content1 content1 content1'"
      - grid-template-rows: "min-content min-content"
      - grid-template-columns: "1fr 2.5fr 1fr"
      - row-gap: "var(--hcp_minimalist_default_row_gap)"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_hcp_light_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
      header:
        - align-self: "center"
        - margin-bottom: "4px"
      content1:
        - align-self: "center"
      history:
        - justify-self: "right"

  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template:
          - "popup_hcp_button_back"
          - "color_hcp_card_popup_default"

    history:
      card:
        type: "custom:button-card"
        template:
          - "popup_hcp_button_history"
          - "color_hcp_card_popup_default"
        variables:
          popup_hcp_history_entity: "[[[ return variables.popup_hcp_light_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        template:
          - "popup_hcp_title"
          - "color_hcp_card_popup_default"
    content1:
      card:
        type: custom:light-entity-card
        entity: light.living_room_bulbs
        hide_header: true
        consolidate_entities: true
        child_card: true
        card_mod:
          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
            }
