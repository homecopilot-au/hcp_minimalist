---
popup_hcp_refrigerator:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "hcp_global_defaults"
    - "color_hcp_card_popup_default"
  variables:
    popup_hcp_refrigerator_name: ""
    popup_hcp_refrigerator_fridge_control: ""
    popup_hcp_refrigerator_freezer_control: ""
    popup_hcp_refrigerator_express_mode: ""
    popup_hcp_refrigerator_hide_back: false
    popup_hcp_refrigerator_history_entity: ""

  styles:
    grid:
      - grid-template-areas: '"back header history" "divider1 divider1 divider1" "content1 content1 content1" "divider2 divider2 divider2" "content2 content2 content2"'
      - grid-template-columns: "1fr 3fr 1fr"
      - grid-template-rows: "min-content min-content"
      - row-gap: "5px"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_hcp_refrigerator_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "start"
      history:
        - justify-self: "right"
      content1:
        - align-self: "start"
        - margin-left: "0px"

  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_back"
    history:
      card:
        type: "custom:button-card"
        template: "popup_hcp_button_history"
        variables:
          popup_hcp_history_entity: "[[[ return variables.popup_hcp_refrigerator_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        template: "popup_hcp_title"
        name: "[[[ return variables.popup_hcp_refrigerator_name ]]]"
        show_label: false

    divider1:
      card:
        type: "custom:button-card"
        template: "popup_hcp_subtitle"
        name: Thermostats

    content1:
      card:
        type: "horizontal-stack"
        cards:
          - type: "custom:button-card"
            template:
              - "popup_hcp_refrigerator_thermostat"
            entity: "[[[ return variables.popup_hcp_refrigerator_fridge_control ]]]"
          - type: "custom:button-card"
            template:
              - "popup_hcp_refrigerator_thermostat"
            entity: "[[[ return variables.popup_hcp_refrigerator_freezer_control ]]]"

    divider2:
      card:
        type: "custom:button-card"
        template: "popup_hcp_subtitle"
        name: Controls

    content2:
      card:
        type: "horizontal-stack"
        cards:
          - type: "custom:button-card"
            template:
              - "popup_hcp_button"
              - "color_hcp_switch_default"
            entity: "[[[ return variables.popup_hcp_refrigerator_express_mode ]]]"
            hold_action:
              action: "fire-dom-event"
              browser_mod:
                service: "browser_mod.popup"
                data:
                  hide_header: true
                  style: |
                    --popup-background-color: var(--primary-background-color);
                    --popup-border-radius: 20px;
                    --popup-padding-x: 24px;
                    --popup-padding-y: 20px;
                    --popup-max-width: auto
                    --popup-min-width: 800px;
                  size: >
                    [[[
                      const mediaQuery = window.matchMedia('(max-width: 1200px)')
                      if (mediaQuery.matches) {
                        return 'fullscreen'
                      }
                    ]]]
                  content:
                    type: "custom:button-card"
                    template: "popup_hcp_history"
                    entity: "[[[ return variables.popup_hcp_refrigerator_express_mode ]]]"
          - type: "custom:button-card"
            color_type: blank-card
          - type: "custom:button-card"
            color_type: blank-card
