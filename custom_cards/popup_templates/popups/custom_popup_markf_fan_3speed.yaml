---
popup_markf_fan_3speed:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
    - "color_markf_card_popup_default"
  variables:
    popup_markf_fan_3speed_hide_back: false
    popup_markf_fan_3speed_history_entity: "[[[ return entity.entity_id ]]]"
    popup_markf_fan_3speed_switch_color: "color_markf_switch_popup_inactive_on"
    popup_markf_fan_3speed_preset_switch_color: "color_markf_switch_option"
    popup_markf_fan_3speed_speed_1_icon: "[[[ return variables._markf_default_3speedfan_speed_1_icon; ]]]"
    popup_markf_fan_3speed_speed_2_icon: "[[[ return variables._markf_default_3speedfan_speed_2_icon; ]]]"
    popup_markf_fan_3speed_speed_3_icon: "[[[ return variables._markf_default_3speedfan_speed_3_icon; ]]]"
    popup_markf_fan_3speed_preset_1: "[[[ return states[entity.entity_id].attributes?.preset_modes[0]; ]]]"
    popup_markf_fan_3speed_preset_2: "[[[ return states[entity.entity_id].attributes?.preset_modes[1]; ]]]"
    popup_markf_fan_3speed_preset_3: "[[[ return states[entity.entity_id].attributes?.preset_modes[2]; ]]]"
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: '"back header history" "buttons buttons buttons" "divider1 divider1 divider1"'
      - grid-template-columns: "1fr 3fr 1fr"
      - grid-template-rows: "min-content min-content"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    custom_fields:
      back:
        - display: >
            [[[
                  if (variables.popup_markf_fan_3speed_hide_back) {
                      return "none";
                  } else {
                      return "block";
                  }
            ]]]
        - align-text: "left"
        - justify-self: "left"
      header:
        - align-self: "start"
      history:
        - justify-self: "right"
      buttons:
        - align-self: "start"
        - margin-left: "0px"
  custom_fields:
    back:
      card:
        type: "custom:button-card"
        template:
          - "popup_markf_button_back"
          - "color_markf_card_popup_default"
    history:
      card:
        type: "custom:button-card"
        template:
          - "popup_markf_button_history"
          - "color_markf_card_popup_default"
        variables:
          popup_markf_history_entity: "[[[ return variables.popup_markf_fan_3speed_history_entity ]]]"

    header:
      card:
        type: "custom:button-card"
        template:
          - "popup_markf_title"
          - "color_markf_card_popup_default"
        name: "[[[ return entity.attributes.friendly_name ]]]"
        show_label: true
        label: "[[[ return entity.state ]]]"

    buttons:
      card:
        type: "custom:button-card"
        template:
          - "markf_list_3x4_items"
          - "color_markf_card_popup_default"
        custom_fields:
          item2:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_button_label"]
                  templates.push(variables.popup_markf_fan_3speed_switch_color)
                  return templates;
                ]]]
              icon: "[[[ return entity.attributes.icon; ]]]"
              variables:
                markf_widget_button_label: "[[[ return entity.state; ]]]"
              tap_action:
                action: "toggle"
          item5:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_button_label"]
                  templates.push(variables.popup_markf_fan_3speed_preset_switch_color)
                  return templates;
                ]]]
              icon: "[[[ return variables.popup_markf_fan_3speed_speed_1_icon; ]]]"
              variables:
                markf_widget_button_label: "[[[ return variables.popup_markf_fan_3speed_preset_1; ]]]"
                color_markf_switch_option_name: "[[[ return variables.popup_markf_fan_3speed_preset_1; ]]]"
                color_markf_switch_option_state: "[[[ return states[entity.entity_id].attributes?.preset_mode; ]]]"
              styles:
                card:
                  - padding: "var(--markf_minimalist_default_padding)"
              tap_action:
                action: call-service
                service: "fan.set_preset_mode"
                service_data:
                  entity_id: "[[[ return entity.entity_id; ]]]"
                  preset_mode: "[[[ return variables.popup_markf_fan_3speed_preset_1; ]]]"
              hold_action:
                action: "fire-dom-event"
                browser_mod:
                  service: "browser_mod.popup"
                  data:
                    hide_header: true
                    style: |
                      --popup-background-color: var(--markf_minimalist_popup_background_color);
                      --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                      --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                      --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                      --popup-max-width: var(--markf_minimalist_popup_max_width);
                      --popup-min-width: var(--markf_minimalist_popup_min_width);;
                    size: >
                      [[[
                        const mediaQuery = window.matchMedia('(max-width: 1200px)')
                        if (mediaQuery.matches) {
                          return 'fullscreen'
                        }
                      ]]]
                    content:
                      type: "custom:button-card"
                      template: "popup_markf_history"
                      entity: "[[[ return entity.entity_id; ]]]"
          item8:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_button_label"]
                  templates.push(variables.popup_markf_fan_3speed_preset_switch_color)
                  return templates;
                ]]]
              icon: "[[[ return variables.popup_markf_fan_3speed_speed_2_icon; ]]]"
              variables:
                markf_widget_button_label: "[[[ return variables.popup_markf_fan_3speed_preset_2; ]]]"
                color_markf_switch_option_name: "[[[ return variables.popup_markf_fan_3speed_preset_2; ]]]"
                color_markf_switch_option_state: "[[[ return states[entity.entity_id].attributes?.preset_mode; ]]]"
              styles:
                card:
                  - padding: "var(--markf_minimalist_default_padding)"
              tap_action:
                action: call-service
                service: "fan.set_preset_mode"
                service_data:
                  entity_id: "[[[ return entity.entity_id; ]]]"
                  preset_mode: "[[[ return variables.popup_markf_fan_3speed_preset_2; ]]]"
              hold_action:
                action: "fire-dom-event"
                browser_mod:
                  service: "browser_mod.popup"
                  data:
                    hide_header: true
                    style: |
                      --popup-background-color: var(--markf_minimalist_popup_background_color);
                      --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                      --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                      --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                      --popup-max-width: var(--markf_minimalist_popup_max_width);
                      --popup-min-width: var(--markf_minimalist_popup_min_width);;
                    size: >
                      [[[
                        const mediaQuery = window.matchMedia('(max-width: 1200px)')
                        if (mediaQuery.matches) {
                          return 'fullscreen'
                        }
                      ]]]
                    content:
                      type: "custom:button-card"
                      template: "popup_markf_history"
                      entity: "[[[ return entity.entity_id; ]]]"
          item11:
            card:
              type: "custom:button-card"
              entity: "[[[ return entity.entity_id ]]]"
              template: >
                [[[
                  var templates = ["markf_widget_button_label"]
                  templates.push(variables.popup_markf_fan_3speed_preset_switch_color)
                  return templates;
                ]]]
              icon: "[[[ return variables.popup_markf_fan_3speed_speed_3_icon; ]]]"
              variables:
                markf_widget_button_label: "[[[ return variables.popup_markf_fan_3speed_preset_3; ]]]"
                color_markf_switch_option_name: "[[[ return variables.popup_markf_fan_3speed_preset_3; ]]]"
                color_markf_switch_option_state: "[[[ return states[entity.entity_id].attributes?.preset_mode; ]]]"
              styles:
                card:
                  - padding: "var(--markf_minimalist_default_padding)"
              tap_action:
                action: call-service
                service: "fan.set_preset_mode"
                service_data:
                  entity_id: "[[[ return entity.entity_id; ]]]"
                  preset_mode: "[[[ return variables.popup_markf_fan_3speed_preset_3; ]]]"
              hold_action:
                action: "fire-dom-event"
                browser_mod:
                  service: "browser_mod.popup"
                  data:
                    hide_header: true
                    style: |
                      --popup-background-color: var(--markf_minimalist_popup_background_color);
                      --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                      --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                      --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                      --popup-max-width: var(--markf_minimalist_popup_max_width);
                      --popup-min-width: var(--markf_minimalist_popup_min_width);;
                    size: >
                      [[[
                        const mediaQuery = window.matchMedia('(max-width: 1200px)')
                        if (mediaQuery.matches) {
                          return 'fullscreen'
                        }
                      ]]]
                    content:
                      type: "custom:button-card"
                      template: "popup_markf_history"
                      entity: "[[[ return entity.entity_id; ]]]"
