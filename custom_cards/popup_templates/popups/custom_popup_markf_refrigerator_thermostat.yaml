popup_markf_refrigerator_thermostat:
  show_icon: false
  show_name: false
  show_label: false
  show_units: false
  template:
    - "ulm_translation_engine"
    - "ulm_custom_actions"
  styles:
    grid:
      - grid-template-areas: '"item1" "item2"'
      - grid-template-columns: "auto"
      - grid-template-rows: "min-content min-content"
    card:
      - background: "var(--primary-background-color)"
      - box-shadow: "none"
      - padding: "6px"

  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        template:
          - "markf_icon_info"
        entity: "[[[ return entity.entity_id ]]]"
        variables:
          markf_icon_info_label: "[[[ return variables.ulm_translation_hvac ]]]"
          ulm_card_tap_action: "popup"
          ulm_card_hold_action: "popup"
          ulm_custom_popup:
            template: "popup_markf_history"
            entity: "[[[ return entity.entity_id ]]]"
    item2:
      card:
        type: "custom:button-card"
        template: "list_3_items"
        styles:
          card:
            - background: "none"
        custom_fields:
          item1:
            card:
              type: "custom:button-card"
              template: "widget_icon"
              entity: "[[[ return entity.entity_id ]]]"
              icon: "mdi:minus"
              tap_action:
                action: "call-service"
                service: "climate.set_temperature"
                service_data:
                  temperature: |
                    [[[
                      const unit = hass.config.unit_system.temperature
                      const step = variables.ulm_card_thermostat_temp_step || entity.attributes.target_temp_step || (unit == '°F' ? 1.0 : 0.5)
                      return (parseFloat(states[entity.entity_id].attributes.temperature) - step)
                    ]]]
                  entity_id: "[[[ return entity.entity_id ]]]"
          item2:
            card:
              type: "custom:button-card"
              show_icon: false
              show_name: false
              show_label: true
              entity: "[[[ return entity.entity_id ]]]"
              label: |-
                [[[
                    var temperature = entity.attributes.temperature || entity.attributes.target_temp_high;
                    if (temperature == null) {
                      var temperature = '-';
                    }
                    return temperature + hass.config.unit_system.temperature;
                ]]]
              styles:
                card:
                  - background: "none"
                  - box-shadow: "none"
          item3:
            card:
              type: "custom:button-card"
              template: "widget_icon"
              entity: "[[[ return entity.entity_id ]]]"
              icon: "mdi:plus"
              tap_action:
                action: "call-service"
                service: "climate.set_temperature"
                service_data:
                  temperature: |
                    [[[
                      const unit = hass.config.unit_system.temperature
                      const step = variables.ulm_card_thermostat_temp_step || entity.attributes.target_temp_step || (unit == '°F' ? 1.0 : 0.5)
                      return (parseFloat(states[entity.entity_id].attributes.temperature) + step)
                    ]]]
                  entity_id: "[[[ return entity.entity_id ]]]"
