---
popup_markf_button_power:
  variables:
    _popup_markf_button_power_area: >
      [[[ 
        const entityObj = hass.entities?.[entity.entity_id];
        const deviceId = entityObj?.device_id;
        const areaId = entityObj?.area_id || hass.devices?.[deviceId]?.area_id;
        return hass.areas?.[areaId]?.name;
      ]]]    
    popup_markf_button_power_consumption_total: ""
    popup_markf_button_power_show_area: true
  show_icon: true
  show_name: true
  show_label: true
  show_state: true
  state_display: >
    [[[
      if (entity.attributes?.power_sensor) {
          return states[entity.attributes.power_sensor].state + ' ' + states[entity.attributes.power_sensor].attributes.unit_of_measurement
        } else {
          return ""
        }
    ]]]
  label: >
    [[[ 
      if (variables.popup_markf_button_power_show_area) {
        return variables._popup_markf_button_power_area
      }
    ]]]
  styles:
    grid:
      - grid-template-areas: '"s" "i" "l" "n"'
      - grid-template-columns: 1fr
      - grid-template-rows: "min-content min-content min-content min-content"
      - row-gap: "var(--markf_minimalist_default_row_gap)"
    card:
      - background: "none"
      - box-shadow: "none"
      - border-radius: "none"
      - padding: "var(--markf_minimalist_default_padding)"
      - height: >
          [[[ 
            if (variables.popup_markf_button_power_show_area) {
              return "var(--markf_minimalist_power_button_card_height_with_area)"
            } else {
              return "var(--markf_minimalist_power_button_card_height)"
            }
          ]]]
    img_cell:
      - border-radius: "50%"
      - place-self: "center"
      - width: "42px"
      - height: "42px"
      - box-shadow: "var(--box-shadow)"
    name:
      - justify-self: "center"
      - font-weight: "var(--markf_minimalist_power_button_font_weight)"
      - font-size: "var(--markf_minimalist_power_button_font_size)"
      - white-space: "initial"
      - text-overflow: "initial"
      - overflow: "initial"
    label:
      - justify-self: "center"
      - font-weight: "var(--markf_minimalist_power_button_font_weight)"
      - font-size: "var(--markf_minimalist_power_button_font_size)"
      - white-space: "initial"
      - text-overflow: "initial"
      - overflow: "initial"
    state:
      - justify-self: "right"
      - font-weight: "var(--markf_minimalist_power_button_font_weight)"
      - font-size: "var(--markf_minimalist_power_button_font_size)"

