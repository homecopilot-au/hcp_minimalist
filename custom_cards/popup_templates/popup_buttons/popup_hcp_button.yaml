---
popup_hcp_button:
  show_icon: true
  show_name: true
  styles:
    grid:
      - grid-template-areas: "'i' 'n'"
      - grid-template-columns: "auto"
      - grid-template-rows: "min-content min-content"
    card:
      - background: "none"
      - box-shadow: "none"
      - border-radius: "none"
      - padding: "12px"
    img_cell:
      - border-radius: "50%"
      - place-self: "center"
      - width: "42px"
      - height: "42px"
      - box-shadow: "var(--box-shadow)"
    name:
      - justify-self: "center"
      - font-weight: "bold"
      - font-size: "14px"
      - margin-top: "12px"
      - white-space: "initial"
      - text-overflow: "initial"
      - overflow: "initial"
