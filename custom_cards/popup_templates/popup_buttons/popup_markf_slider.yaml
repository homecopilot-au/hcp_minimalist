---
popup_markf_slider:
  show_icon: false
  show_label: false
  show_name: false
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
    - "color_markf_card_popup_default"
  variables:
    popup_markf_slider_allow_tapping: false
    popup_markf_slider_vertical: false
    popup_markf_slider_flipped: false
  styles:
    grid:
      - grid-template-areas: '"item1 item2"'
      - grid-template-columns: "1.5fr 3fr"
      - grid-template-rows: "min-content"
    card:
      - border-radius: "var(--border-radius)"
      - box-shadow: "var(--markf_minimalist_slider_box_shadow)"
      - padding: "0px"
    custom_fields:
      item2:
        - padding-right: "12px"
  custom_fields:
    item1:
      card:
        type: "custom:button-card"
        entity: "[[[ return entity.entity_id ]]]"
        label: "[[[ return entity.state ]]]"
        show_icon: false
        show_label: true
        styles:
          grid:
            - grid-template-areas: "'l' 'n'"
            - grid-template-columns: "auto"
            - grid-template-rows: "min-content min-content"
          card:
            - background: "none"
            - box-shadow: "none"
            - border-radius: "none"
            - padding: "0px 6px 0px 6px"
          name:
            - justify-self: "center"
            - font-weight: "var(--markf_minimalist_slider_name_font_weight)"
            - font-size: "var(--markf_minimalist_slider_name_font_size)"
            - margin-top: "0px"
            - white-space: "initial"
            - text-overflow: "initial"
            - overflow: "initial"
          label:
            - justify-self: "center"
            - font-weight: "var(--markf_minimalist_slider_state_font_weight)"
            - font-size: "var(--markf_minimalist_slider_state_font_size)"
            - margin-top: "0px"
            - white-space: "initial"
            - text-overflow: "initial"
            - overflow: "initial"
        hold_action:
          action: "fire-dom-event"
          browser_mod:
            service: "browser_mod.popup"
            data:
              hide_header: true
              style: |
                --popup-background-color: var(--markf_minimalist_popup_background_color);
                --popup-border-radius: var(--markf_minimalist_popup_border_radius);
                --popup-padding-x: var(--markf_minimalist_popup_padding_x);
                --popup-padding-y: var(--markf_minimalist_popup_padding_y);
                --popup-max-width: var(--markf_minimalist_popup_max_width);
                --popup-min-width: var(--markf_minimalist_popup_min_width);;
              size: >
                [[[
                  const mediaQuery = window.matchMedia('(max-width: 1200px)')
                  if (mediaQuery.matches) {
                    return 'fullscreen'
                  }
                ]]]
              content:
                type: "custom:button-card"
                template: "popup_markf_history"
                entity: "[[[ return entity.entity_id ]]]"
    item2:
      card:
        type: "custom:my-slider-v2"
        entity: "[[[ return entity.entity_id ]]]"
        allowTapping: "[[[ return variables.card_markf_cover_slider_allow_tapping ]]]"
        vertical: "[[[ return variables.card_markf_cover_slider_vertical ]]]"
        flipped: "[[[ return variables.card_markf_cover_slider_flipped ]]]"
        styles:
          card:
            - height: "var(--markf_minimalist_slider_height_horizontal)"
          container:
            - border-width: "var(--markf_minimalist_slider_border_width)"
            - border-style: "var(--markf_minimalist_slider_border_style)"
            - border-color: "[[[ return 'rgba(var(--markf_minimalist_slider_border_colour),var(--markf_minimalist_slider_border_opacity))'; ]]]"
            - border-radius: var(--markf_minimalist_slider_border_radius)
            - box-shadow: "var(--markf_minimalist_slider_box_shadow)"
          progress:
            - background: "[[[ return 'rgba(var(--markf_minimalist_slider_main_color),var(--markf_minimalist_slider_main_opacity))'; ]]]"
          track:
            - background: "[[[ return 'rgba(var(--markf_minimalist_slider_secondary_color),var(--markf_minimalist_slider_secondary_opacity))'; ]]]"
          thumb:
            - width: "var(--markf_minimalist_slider_thumb_width_horizontal)"
            - background: "[[[ return 'rgba(var(--markf_minimalist_slider_thumb_color),var(--markf_minimalist_slider_thumb_opacity))'; ]]]"
            - border-radius: "var(--markf_minimalist_slider_thumb_border_radius_horizontal)"
