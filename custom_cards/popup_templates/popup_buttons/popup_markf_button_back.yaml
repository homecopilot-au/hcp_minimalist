popup_markf_button_back:
  template:
    - "ulm_translation_engine"
    - "markf_global_defaults"
    - "markf_widget_icon"
    - "color_markf_card_popup_default"
    - "color_markf_button_popup"
  show_name: false
  variables:
    popup_markf_button_back_path: >
      [[[
        return hass["panelUrl"];
      ]]]
    popup_markf_button_back_icon: "[[[ return variables._markf_default_popup_back_icon; ]]]"
  icon: "[[[ return variables.popup_markf_button_back_icon; ]]]"
  tap_action:
    action: "fire-dom-event"
    browser_mod:
      service: "browser_mod.close_popup"
      data: {}
